{id:"jvm-gc",phase:"core",title:"JVM Memory & GC",tag:"Advanced",level:"advanced",
summary:"JVM memory areas, garbage collection algorithms, heap tuning, memory leaks, and profiling.",
concepts:[
["Heap","Where all objects live; divided into Young and Old (Tenured) generation."],
["Stack","Per-thread; holds stack frames with local variables and return addresses."],
["Young Generation","Eden + two Survivor spaces; most short-lived objects; Minor GC collects here."],
["Old Generation","Promoted long-lived objects; collected by Major/Full GC."],
["Metaspace","Class metadata (replaced PermGen in Java 8); in native memory, auto-grows."],
["GC Root","Entry points reachable by the JVM: stack frames, static fields, JNI references."],
["Mark and Sweep","Mark all reachable objects; sweep (collect) everything else."],
["G1 GC","Region-based collector; predictable pause targets; default since Java 9."],
["ZGC","Low-latency GC; < 1ms pauses regardless of heap size; Java 15+ production-ready."],
["TLAB","Thread-Local Allocation Buffer: each thread allocates from its own Eden slice — no synchronisation."],
],
questions:[
["What are the main JVM memory areas?","Heap: shared among threads; all objects allocated here. Stack: per-thread; holds frames with local variables and partial results. Method Area / Metaspace: class metadata, static fields. PC Register: current bytecode instruction pointer per thread. Native Method Stack: for JNI calls."],
["Difference between heap and stack?","Stack: fixed-size per thread (default ~512KB–1MB); holds local variables and references; LIFO; memory freed when method returns. Heap: shared, GC-managed, holds actual objects. StackOverflowError when stack is exhausted; OutOfMemoryError when heap is exhausted."],
["What are the heap generations?","Young generation: Eden + two Survivor spaces (S0, S1). New objects allocated in Eden. Minor GC collects Young; surviving objects promoted to Survivor, then to Old after N GC cycles. Old (Tenured) generation: long-lived objects collected by Major/Full GC. Full GC = Young + Old + Metaspace."],
["What is garbage collection?","The JVM's automatic memory management — identifies objects with no reachable references (unreachable from GC roots) and reclaims their memory. Modern collectors use a mark-and-sweep (or mark-and-compact) algorithm. Generational hypothesis: most objects die young — optimise for that case."],
["What are GC roots?","Entry points that are always considered reachable: local variables and operands in active stack frames, static fields, JNI global references, active threads, class objects. Any object reachable from a GC root is kept; all others are eligible for collection."],
["G1 GC vs ZGC?","G1 (default Java 9+): region-based, concurrent marking, configurable pause target (-XX:MaxGCPauseMillis), good balance of throughput and latency for most applications. ZGC (production Java 15+): concurrent, low-latency — sub-millisecond pauses regardless of heap size; slightly lower throughput. Use ZGC for latency-sensitive services."],
["What is a memory leak in Java?","An object is no longer needed but a reference keeps it reachable, preventing GC. Common causes: static collections growing unbounded, ThreadLocal not removed in thread pools, event listeners not deregistered, caches without eviction. Diagnose with heap dumps (jmap, VisualVM, Eclipse MAT)."],
["What is the difference between Minor GC and Full GC?","Minor GC: collects only the Young generation; fast (ms); happens frequently. Major GC: collects the Old generation. Full GC: collects Young + Old + Metaspace; can cause long pauses (seconds); triggered when Old gen is full or by explicit System.gc(). Avoid Full GC in production via proper heap sizing."],
["What JVM flags control heap size?","-Xms: initial heap size (e.g. -Xms256m). -Xmx: maximum heap size (e.g. -Xmx4g). Set both equal to avoid re-sizing overhead. -XX:NewRatio: ratio of Old to Young generation. -XX:MaxGCPauseMillis: G1 pause target. -Xss: thread stack size."],
["What is TLAB (Thread-Local Allocation Buffer)?","Each thread gets a private slice of Eden for object allocation, so allocation requires no synchronisation — just a pointer bump. When a TLAB is exhausted it is retired and a new one allocated. TLAB makes object allocation nearly as fast as stack allocation."],
["What is Metaspace and how does it differ from PermGen?","PermGen (pre-Java 8): fixed-size, stored class metadata in heap — caused PermGen OutOfMemoryError. Metaspace (Java 8+): stores class metadata in native memory; auto-grows by default (capped by system RAM). -XX:MaxMetaspaceSize sets a limit. MetaspaceOOME is now rare."],
["How to diagnose a memory leak?","1) Monitor heap with JConsole or Micrometer. 2) Take heap dumps with `jmap -dump:live,format=b,file=heap.hprof <pid>`. 3) Analyse with Eclipse Memory Analyzer (MAT) — look for large retained heaps and GC roots keeping objects alive. 4) Check for unbounded static collections, missing ThreadLocal.remove(), listener leaks."],
["What is stop-the-world pause?","A pause where all application threads are suspended so the GC can safely operate. Even concurrent collectors like G1 have short STW phases (initial mark, remark). ZGC minimises STW to < 1ms by doing most work concurrently. Long STW pauses cause visible latency spikes."],
["Difference between Serial, Parallel, and Concurrent GC?","Serial: single-threaded; for small heaps/single-CPU. Parallel (Throughput): multi-threaded GC threads, STW; maximises throughput. G1 (Concurrent): overlaps GC work with application threads; balances throughput and latency. ZGC/Shenandoah: mostly concurrent; minimise pause times."],
["How does object finalization work and why is it deprecated?","When the GC determines an object is unreachable, it places it on a finalization queue; a finalizer thread calls finalize(). Problems: unpredictable timing, objects can be resurrected, delays GC, can cause OOMEs. Deprecated Java 9+. Use try-with-resources and Cleaner/PhantomReference instead."],
],
scenarios:[
["Your application has steadily growing heap usage that never drops — what do you investigate?","Take heap dumps over time and analyse with MAT. Look for the dominators — objects with the largest retained heap. Common culprits: static Map caches without eviction, ThreadLocal not removed in thread pools, Hibernate session holding entity graph, registered listeners never removed."],
["Latency spikes every few minutes correlate with Full GC. How do you fix it?","Tune heap: increase -Xmx to reduce GC frequency. Set -Xms equal to -Xmx. Switch to G1 and set -XX:MaxGCPauseMillis=200. If still problematic, switch to ZGC. Also check for excessive object churn (allocations per second) with GC logs."],
["PermGen OutOfMemoryError in an application that redeploys frequently (Tomcat).","PermGen leak from class loader retention — common in app servers. Fix: upgrade to Java 8+ (Metaspace). If stuck on Java 7: ensure servlet/JSP containers release class loaders on undeploy; use WeakReferences for class-level caches."],
],
coding:[
["Use a Cleaner to release a native resource when the holder is GCed.","PhantomReference-based approach via java.lang.ref.Cleaner (Java 9+).",`public class NativeResource implements AutoCloseable {
    private static final Cleaner CLEANER = Cleaner.create();
    private final Cleaner.Cleanable cleanable;

    public NativeResource(long handle) {
        cleanable = CLEANER.register(this, new ReleaseAction(handle));
    }
    @Override public void close() { cleanable.clean(); }

    private record ReleaseAction(long handle) implements Runnable {
        public void run() { nativeFree(handle); } // JNI call
    }
}`],
["Identify GC pause time in logs.","Enable GC logging flags.",`// JVM flags for GC logging
// -Xlog:gc*:file=gc.log:time,uptime,level,tags
// -XX:+UseG1GC
// -XX:MaxGCPauseMillis=200
// Then parse gc.log with GCViewer or JDK Flight Recorder
`],
]},
{id:"modern-java",phase:"core",title:"Modern Java (9–21)",tag:"Modern Java",level:"intermediate",
summary:"Records, sealed classes, pattern matching, switch expressions, text blocks, virtual threads, and the module system.",
concepts:[
["Records (Java 16)","Immutable data carriers; compact syntax; auto-generates constructor, getters, equals, hashCode, toString."],
["Sealed Classes (Java 17)","Restrict which classes can extend/implement a type; enables exhaustive pattern matching."],
["Pattern Matching instanceof (Java 16)","if (obj instanceof String s) — binds the variable without a cast."],
["Switch Expressions (Java 14)","switch as expression returning a value; arrow labels; yield keyword."],
["Pattern Matching Switch (Java 21)","switch on any type with type patterns, guard clauses (when)."],
["Text Blocks (Java 15)","Triple-quote multi-line strings; automatic re-indentation."],
["var (Java 10)","Local variable type inference; type inferred from right-hand side."],
["Virtual Threads (Java 21)","Lightweight JVM threads; millions at once; blocking is cheap."],
["Sequenced Collections (Java 21)","New interfaces with explicit first/last element ordering."],
["Module System (Java 9)","Strong encapsulation and explicit dependency declarations via module-info.java."],
],
questions:[
["What are records?","Records (Java 16) are transparent immutable data carriers. Declare components in the header; the compiler auto-generates a canonical constructor, component accessors (not JavaBean-style getters — getName() not getx()), equals(), hashCode(), and toString(). Records cannot extend a class, can implement interfaces, and components are final."],
["What are sealed classes?","Sealed classes/interfaces (Java 17) restrict which classes may extend them, declared with the permits clause. Each permitted subclass must be final, sealed, or non-sealed. Enables exhaustive switch/pattern-matching without a default clause — the compiler knows all subtypes."],
["What is pattern matching instanceof?","Java 16+: `if (obj instanceof String s) { ... s ... }` binds s within the true branch without an explicit cast. Combined with && conditions: `if (obj instanceof String s && s.length() > 0)`. Removes boilerplate cast-then-use patterns."],
["What are switch expressions?","Java 14+: switch can be used as an expression returning a value. Arrow labels (case X -> value) are non-fall-through. The yield keyword returns a value from a block. Traditional colon-fall-through style is preserved. Compiler forces exhaustiveness for expressions."],
["What is var?","Java 10+ local variable type inference: `var list = new ArrayList<String>()` — type inferred as ArrayList<String>. Reduces verbosity for long generic types. Only for local variables; not for fields, parameters, or return types. Does not make Java dynamically typed."],
["Difference between records and regular classes?","Records: compiler-generated canonical constructor, accessors, equals/hashCode/toString; components always final; cannot extend a class; cannot have instance fields beyond components; implicitly final. Regular classes: full control over all methods; mutable; extensible."],
["What is pattern matching switch (Java 21)?","Switch on any type using type patterns: `switch (shape) { case Circle c -> ...; case Rectangle r when r.area() > 100 -> ...; }`. Requires exhaustiveness. Null can be a case. Guard clauses (when) filter patterns further. Replaces instanceof chains."],
["What are text blocks?","Java 15+ triple-double-quote multi-line strings. The compiler strips leading whitespace based on the closing delimiter indentation; trailing whitespace is removed per line. Ideal for embedding SQL, JSON, or HTML. Standard Java escape sequences work normally inside text blocks."],
["Improvements to Streams and Optionals in Java 9+?","Java 9: Stream.iterate(seed, predicate, f) for finite streams; takeWhile(predicate), dropWhile(predicate); Stream.ofNullable(). Java 10: Collectors.toUnmodifiableList/Set/Map(). Java 12: Collectors.teeing(). Optional: ifPresentOrElse, or(), stream() (Java 9+)."],
["What is the HTTP Client (Java 11)?","java.net.http.HttpClient: modern HTTP/1.1 and HTTP/2 client. Supports synchronous send() and asynchronous sendAsync(). Built-in support for reactive streams (BodyPublishers, BodyHandlers). Replaces the old HttpURLConnection."],
["What are sealed interfaces and how do they help with ADTs?","Sealed interfaces restrict implementations to a known set, modelling algebraic data types (ADTs). Example: `sealed interface Shape permits Circle, Rectangle, Triangle`. Combined with pattern-matching switch, the compiler enforces exhaustiveness — no default needed — which catches missing cases at compile time."],
["What is StructuredConcurrency (Java 21 preview)?","StructuredTaskScope groups related concurrent tasks so they are treated as a unit. If any task fails, siblings are cancelled automatically (ShutdownOnFailure). Improves observability, error handling, and cancellation compared to ad-hoc CompletableFuture composition."],
["What are sequenced collections (Java 21)?","New interfaces: SequencedCollection (addFirst/Last, getFirst/Last, reversed()), SequencedSet, SequencedMap. Added to the Collection hierarchy: List, Deque, LinkedHashSet, LinkedHashMap implement them. Provides uniform API for collections with defined encounter order."],
["What is the Java module system?","Java 9+ JPMS (Java Platform Module System). Each module declares: requires (dependencies), exports (accessible packages). Encapsulates packages not exported — reflection on non-exported packages fails without opens. Benefits: strong encapsulation, explicit dependencies, improved security, smaller runtime images with jlink."],
["What are unnamed patterns and variables (Java 21)?","Unnamed variables (_) can be used for unused components in patterns and catch blocks: `catch (IOException _)`. Unnamed patterns in switch: `case Point(_, int y)` matches any Point and binds y. Improves readability by making unused bindings explicit."],
],
scenarios:[
["Model an AST node for a simple expression language using sealed classes and records.","Define sealed interface Expr permits Num, Add, Mul. Each is a record: record Num(int value) implements Expr; record Add(Expr left, Expr right) implements Expr. Evaluate with a pattern-matching switch — no default needed, exhaustiveness guaranteed at compile time."],
["Replace a chain of instanceof + cast checks with modern Java.","Use pattern matching switch (Java 21): switch (obj) { case Integer i -> ...; case String s -> ...; case null -> ...; default -> ...; }. Cleaner, exhaustive, and composable with guard clauses."],
["Migrate a service to use virtual threads.","Replace Executors.newFixedThreadPool(200) with Executors.newVirtualThreadPerTaskExecutor(). Each request runs on its own virtual thread; blocking I/O is handled by the JVM without consuming an OS thread. No code changes needed in the task logic — write plain blocking code."],
],
coding:[

    record Ok<T>(T value)        implements Result<T> {}
    record Err<T>(String message) implements Result<T> {}
}

// Usage

String msg = switch (r) {
    case Result.Ok<Integer>  ok  -> "Value: " + ok.value();
    case Result.Err<Integer> err -> "Error: " + err.message();
};`],
["Use virtual threads to run 10 000 tasks.","Cheap blocking: no thread pool sizing needed.",`try (var scope = Executors.newVirtualThreadPerTaskExecutor()) {

}`],
["Pattern-matching switch to format shapes.","Exhaustive, no instanceof chains.",`String describe(Shape s) {
    return switch (s) {

{id:"spring-core",phase:"spring",title:"Spring Core & AOP",tag:"Spring",level:"intermediate",
summary:"IoC container, dependency injection, bean lifecycle, AOP, transactions, and Spring expression language.",
concepts:[
["IoC Container","Manages object creation and wiring; ApplicationContext is the main interface."],
["Dependency Injection","Constructor, setter, or field injection; constructor injection is preferred."],
["Bean Scope","singleton (default), prototype, request, session, application, websocket."],
["Bean Lifecycle","Instantiate → Inject → @PostConstruct → Ready → @PreDestroy → Destroyed."],
["@Component","Marks a class for component scanning; @Service, @Repository, @Controller are specialisations."],
["@Bean","Factory method in a @Configuration class; full control over bean creation."],
["AOP","Aspect-Oriented Programming; separates cross-cutting concerns (logging, transactions, security)."],
["Pointcut","Expression that selects join points (method calls) where advice applies."],
["@Transactional","Spring proxy applies transaction boundary around the annotated method."],
["BeanPostProcessor","Intercepts bean creation after instantiation; @Autowired processing uses it."],
],
questions:[
["What is Inversion of Control (IoC)?","IoC is the design principle where the framework controls object creation and lifecycle instead of application code. In Spring, the IoC container (ApplicationContext) creates beans, injects dependencies, and manages their lifecycle — application code declares what it needs, the container satisfies it."],
["Difference between @Component, @Service, @Repository, @Controller?","All are stereotypes of @Component — semantically equivalent for component scanning. @Repository adds exception translation (DataAccessException wrapping). @Controller marks MVC controllers. @Service marks the service layer. Using the specific stereotype communicates intent and enables future AOP targeting by role."],
["Difference between @Component and @Bean?","@Component: marks a class for classpath scanning; Spring instantiates it directly. @Bean: a method in a @Configuration class that returns a bean instance; used when you need full control over construction (third-party classes, conditional creation, returning an interface). @Bean methods can receive dependencies as parameters."],
["Constructor vs setter vs field injection — which is preferred?","Constructor injection is preferred: makes dependencies explicit, enables immutability (final fields), fails fast on missing dependencies, testable without Spring. Setter injection for optional dependencies. Field injection (@Autowired on field) is discouraged — hides dependencies, cannot be used with final fields, harder to test."],
["What is the bean lifecycle?","1) Instantiation (constructor). 2) Dependency injection. 3) @PostConstruct (or InitializingBean.afterPropertiesSet). 4) Bean is in use. 5) @PreDestroy (or DisposableBean.destroy). 6) GC. BeanPostProcessors intercept before/after each step — @Autowired, @Value processing happen this way."],
["What are bean scopes?","singleton: one instance per ApplicationContext (default). prototype: new instance each time. request: one per HTTP request (web). session: one per HTTP session. application: one per ServletContext. websocket: one per WebSocket session. prototype + singleton injection needs ObjectProvider or @Lookup to avoid stale prototype."],
["What is AOP?","Aspect-Oriented Programming separates cross-cutting concerns (logging, transactions, security, caching) from business logic. Spring AOP uses JDK dynamic proxies (interface-based) or CGLIB proxies (class-based). Key concepts: Aspect, Advice, Pointcut, JoinPoint, Weaving."],
["Aspect, Advice, Pointcut, JoinPoint?","Aspect: class combining pointcut + advice. Advice: the action — @Before, @After, @AfterReturning, @AfterThrowing, @Around. Pointcut: expression selecting join points. JoinPoint: specific execution point (method call). @Around is the most powerful — controls whether the target method runs and can modify args/return value."],
["How does @Transactional work?","Spring wraps the bean in a proxy. On entry the proxy starts a transaction (or joins an existing one, depending on propagation). On normal exit it commits; on unchecked exception it rolls back. The proxy only intercepts external calls — calling a @Transactional method from the same class bypasses the proxy (self-invocation problem)."],
["What is the self-invocation problem in AOP?","When a method in class A calls another @Transactional method in the same class A, the call bypasses the proxy — no transaction is started. Fix: inject the bean itself via ApplicationContext.getBean() or @Autowired (ugly) or use AspectJ weaving, or refactor into a separate class."],
["Transaction propagation types?","REQUIRED (default): join existing or start new. REQUIRES_NEW: suspend existing, start new (useful for audit logs). MANDATORY: must have existing, throws if none. NEVER: must not have existing. SUPPORTS: use existing if present. NOT_SUPPORTED: suspend existing. NESTED: nested save-point in existing transaction."],
["ApplicationContext vs BeanFactory?","BeanFactory: basic IoC container — lazy bean creation. ApplicationContext: extends BeanFactory with: eager singleton creation, event publishing, MessageSource (i18n), AOP proxy creation. Always use ApplicationContext in production. BeanFactory is only for memory-constrained environments."],
["What is @Conditional?","Meta-annotation for conditional bean creation. @ConditionalOnProperty creates a bean only if a property matches. @ConditionalOnClass: class on classpath. @ConditionalOnMissingBean: no existing bean. Used extensively in Spring Boot auto-configuration to wire only what is needed."],
["What is Spring Event publishing?","Beans publish events via ApplicationEventPublisher.publishEvent(). Listeners annotated with @EventListener receive them. By default synchronous. For async: add @Async to the listener. TransactionalEventListener fires after the transaction commits — prevents inconsistency when emitting events from @Transactional methods."],
["What is a BeanFactoryPostProcessor?","Runs after all bean definitions are loaded but before beans are instantiated — can modify bean definitions. Example: PropertySourcesPlaceholderConfigurer resolves ${...} placeholders. Contrast BeanPostProcessor: runs after instantiation to wrap or modify bean instances (e.g., @Autowired injection)."],
["What is circular dependency and how to fix it?","Bean A needs B in its constructor and B needs A — Spring cannot resolve constructor-based circular deps. Fix: refactor to break the cycle (best). Or use setter/field injection (Spring can inject lazily). Or use @Lazy on one parameter. Constructor injection + cycle = design smell."],
],
scenarios:[
["Add method-level execution timing to all @Service classes without modifying them.","Define an @Aspect with @Around(\"within(@org.springframework.stereotype.Service *)\"). Record System.nanoTime() before and after pjp.proceed(). Log the elapsed time. No changes to service classes needed."],
["Ensure audit log writes even if the main transaction rolls back.","Use REQUIRES_NEW propagation in the audit service: @Transactional(propagation = REQUIRES_NEW). The main transaction is suspended; the audit write has its own transaction that commits independently."],
["A prototype-scoped bean injected into a singleton keeps returning the same instance.","Spring injects the prototype once at singleton creation. Fix: inject ObjectProvider<PrototypBean> and call .getObject() each time, or use @Lookup method injection, which Spring overrides to call the container for a fresh instance."],
],
coding:[
["@Around advice for logging execution time.","Intercepts all @Service methods.",`@Aspect @Component
public class TimingAspect {
    private static final Logger log = LoggerFactory.getLogger(TimingAspect.class);

    @Around("within(@org.springframework.stereotype.Service *)")
    public Object time(ProceedingJoinPoint pjp) throws Throwable {
        long start = System.nanoTime();
        try {
            return pjp.proceed();
        } finally {
            long ms = (System.nanoTime() - start) / 1_000_000;
            log.info("{} took {}ms", pjp.getSignature().toShortString(), ms);
        }
    }
}`],
["Custom ApplicationEvent for domain events.","Decouple domain logic from side effects.",`// Event class
public record OrderPlacedEvent(Long orderId, String customerId) {}

// Publisher
@Service @RequiredArgsConstructor
public class OrderService {
    private final ApplicationEventPublisher events;
    @Transactional
    public void place(Order o) {
        repo.save(o);
        events.publishEvent(new OrderPlacedEvent(o.getId(), o.getCustomerId()));
    }
}

// Listener — fires after commit
@Component
public class NotificationListener {
    @TransactionalEventListener
    public void onOrder(OrderPlacedEvent e) { sendEmail(e.customerId()); }
}`],
]},
{id:"spring-boot",phase:"spring",title:"Spring Boot",tag:"Spring",level:"intermediate",
summary:"Auto-configuration, starters, embedded server, Actuator, testing, profiles, and configuration management.",
concepts:[
["Auto-configuration","@ConditionalOn* beans wired automatically when starters are on the classpath."],
["Starter","Curated dependency bundle: spring-boot-starter-web pulls Spring MVC, Tomcat, Jackson."],
["@SpringBootApplication","= @Configuration + @EnableAutoConfiguration + @ComponentScan."],
["Embedded Server","Tomcat/Jetty/Undertow runs inside the JAR; no external server needed."],
["Actuator","Production endpoints: /health, /metrics, /info, /env, /loggers, /threaddump."],
["@ConfigurationProperties","Type-safe binding of property files to a POJO."],
["Profiles","Environment-specific config: @Profile(\"prod\"); application-prod.properties activated with spring.profiles.active."],
["Externalized Config","Properties resolved in order: command line > JNDI > env vars > application.properties > defaults."],
["DevTools","Hot reload on classpath change; faster restart; LiveReload support."],
["Fat JAR","Self-contained executable JAR with all dependencies + embedded server."],
],
questions:[
["What is Spring Boot and what problem does it solve?","Spring Boot eliminates boilerplate Spring configuration. It provides opinionated auto-configuration (wire only what is needed), embedded server (no WAR deployment), starter dependencies (curated transitive deps), production Actuator endpoints, and externalised configuration. The goal: start writing business logic immediately."],
["What is auto-configuration?","Spring Boot scans META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports for auto-configuration classes. Each class uses @Conditional annotations to create beans only when conditions are met (e.g., class on classpath, property set, no existing bean). Override any auto-configured bean by defining your own."],
["What does @SpringBootApplication do?","Combines three annotations: @Configuration (the class declares beans), @EnableAutoConfiguration (triggers auto-configuration), @ComponentScan (scans the package and sub-packages for components). It is a convenience annotation — no magic, just composition."],
["How does embedded server work?","Spring Boot includes Tomcat (default), Jetty, or Undertow as a dependency. DispatcherServlet is registered programmatically. The JAR is executable — `java -jar app.jar` starts the embedded server. No separate server installation or WAR file needed. Can be overridden: exclude tomcat, add jetty."],
["What is Spring Boot Actuator?","Production-ready management endpoints. /actuator/health: liveness/readiness, component health. /metrics: Micrometer metrics (CPU, memory, HTTP latency). /info: custom build/version info. /loggers: change log levels at runtime. /env: active properties. /threaddump, /heapdump. Secure with Spring Security."],
["Difference between @Value and @ConfigurationProperties?","@Value: injects a single property into a field. @ConfigurationProperties: binds a prefix of properties to a POJO — type-safe, composable, IDE-friendly, supports relaxed binding (kebab-case = camelCase). Prefer @ConfigurationProperties for groups of related properties."],
["How do Spring Boot profiles work?","@Profile(\"prod\") on a bean or config activates it only when that profile is active. application-{profile}.properties overrides application.properties for that profile. Activate with: spring.profiles.active=prod (property), SPRING_PROFILES_ACTIVE=prod (env var), or --spring.profiles.active=prod (command line)."],
["Externalised configuration priority order?","Highest to lowest: 1) Command-line args (--server.port=9090). 2) SPRING_APPLICATION_JSON env var. 3) JNDI. 4) Java system properties. 5) OS environment variables. 6) application-{profile}.properties. 7) application.properties. 8) @PropertySource. 9) Default values. Later sources are overridden by earlier ones."],
["What is a Spring Boot starter?","A POM dependency that pulls in all required libraries for a feature. spring-boot-starter-web: Spring MVC + Tomcat + Jackson. spring-boot-starter-data-jpa: Hibernate + Spring Data JPA + HikariCP. spring-boot-starter-security: Spring Security. Create custom starters for shared company libraries."],
["CommandLineRunner vs ApplicationRunner?","Both run code after the Spring context starts. CommandLineRunner.run(String... args) receives raw args. ApplicationRunner.run(ApplicationArguments args) receives parsed named/option args. Use for startup tasks: data seeding, cache warm-up, connection validation."],
["How to test a Spring Boot application?","@SpringBootTest: full context integration test. @WebMvcTest: slice test for controllers + MockMvc (no service/repo layer). @DataJpaTest: H2 + JPA slice (no web). @MockBean: replaces a bean with Mockito mock. @TestPropertySource: override properties per test. Use TestRestTemplate or MockMvc for HTTP-level tests."],
["What is lazy initialisation in Spring Boot?","spring.main.lazy-initialization=true delays bean creation until first use — faster startup, lower initial memory. Drawback: startup errors surface on first request rather than at startup. Enable selectively with @Lazy on specific beans."],
["Difference between Fat JAR and WAR?","Fat JAR (default): self-contained executable; embedded Tomcat; deployed with `java -jar`. WAR: traditional web archive; deployed to external application server (Tomcat, JBoss); requires extending SpringBootServletInitializer. Use Fat JAR for containers/cloud; WAR for legacy app server constraints."],
["How does Spring Boot DevTools work?","Adds two classloaders: one for dependencies (restarts only on restart trigger), one for application classes (triggers hot restart on classpath change). Result: restart in ~1-2s instead of a full JVM restart. LiveReload integration auto-refreshes the browser. Disabled in production (not on classpath when spring-boot-devtools is optional scope)."],
["What is @ConditionalOnMissingBean used for?","Auto-configuration uses it to register a default bean only if no user-defined bean of that type exists. Allows applications to override auto-configured defaults by simply declaring their own bean. This is the primary extensibility mechanism of Spring Boot auto-configuration."],
],
scenarios:[
["Your Spring Boot app starts slowly in development. How to speed it up?","Enable spring.main.lazy-initialization=true for dev profile. Add spring-boot-devtools — it uses a two-classloader restart that is much faster than a full JVM restart. Use @DirtiesContext sparingly in tests to avoid restarting the context."],
["You need different database URLs for dev, staging, and prod.","Create application-dev.properties, application-staging.properties, application-prod.properties with environment-specific spring.datasource.url. Activate with SPRING_PROFILES_ACTIVE env var in each environment. Keep secrets in env vars or Vault, not in property files."],
["Actuator /health reports DOWN. How to investigate?","Check /actuator/health with full detail enabled (management.endpoint.health.show-details=always). It shows each HealthIndicator (DB, Redis, Kafka, disk) and which is DOWN. Add custom HealthIndicator beans for application-level checks."],
],
coding:[
["Type-safe configuration properties.","@ConfigurationProperties with validation.",`@ConfigurationProperties(prefix = "app.payment")
@Validated
public class PaymentProperties {
    @NotBlank private String apiKey;
    @Min(1) @Max(30) private int timeoutSeconds = 10;
    // getters + setters (or use a record in Boot 3.x)
}`],

{id:"rest-api",phase:"spring",title:"REST API Design",tag:"API",level:"intermediate",
summary:"REST constraints, HTTP semantics, versioning, error handling, security, and Spring MVC implementation.",
concepts:[
["REST Constraints","Uniform interface, stateless, client-server, cacheable, layered system, code on demand (optional)."],
["Idempotency","GET/PUT/DELETE are idempotent; POST is not. Repeating an idempotent request has the same result."],
["HTTP Methods","GET (read), POST (create), PUT (replace), PATCH (partial update), DELETE (remove)."],
["Status Codes","2xx success, 3xx redirect, 4xx client error, 5xx server error."],
["Content Negotiation","Client requests format via Accept header; server responds with Content-Type."],
["HATEOAS","Hypermedia controls in response body; clients navigate via links."],
["@RestController","= @Controller + @ResponseBody; methods return data, not view names."],
["@ControllerAdvice","Global exception handler; maps exceptions to HTTP responses."],
["Versioning","URI path, query param, Accept header, custom header."],
["Pagination","Page number + size; cursor-based for large datasets."],
],
questions:[
["What are the REST architectural constraints?","1) Uniform interface: consistent resource identification, manipulation via representations. 2) Stateless: each request self-contained; no server-side session. 3) Cacheable: responses declare cacheability. 4) Client-server: separate concerns. 5) Layered system: clients don't know if they talk to origin server or proxy. 6) Code on demand (optional): server can send executable code."],
["Which HTTP methods are idempotent?","GET, PUT, DELETE, HEAD, OPTIONS: repeating the request N times has the same effect as calling it once. POST: creates a new resource each time (not idempotent). PATCH: depends on implementation. Idempotency is crucial for safe retries."],
["Common HTTP status codes?","200 OK, 201 Created, 204 No Content, 301/302 Redirect, 400 Bad Request, 401 Unauthorized (not authenticated), 403 Forbidden (authenticated but no permission), 404 Not Found, 409 Conflict, 422 Unprocessable Entity, 429 Too Many Requests, 500 Internal Server Error, 503 Service Unavailable."],
["Difference between @Controller and @RestController?","@Controller returns view names (for HTML rendering with Thymeleaf/JSP). @RestController = @Controller + @ResponseBody on every method — returns serialised data (JSON/XML) directly. For REST APIs, always use @RestController."],
["How to handle exceptions globally in Spring MVC?","@ControllerAdvice (or @RestControllerAdvice) class with @ExceptionHandler methods. Maps exception types to HTTP responses: @ExceptionHandler(ResourceNotFoundException.class) returns 404. Use ProblemDetail (RFC 9457, Spring 6+) for standardised error response body."],
["REST API versioning strategies?","1) URI path: /api/v1/users (simplest, cacheable). 2) Query parameter: /api/users?version=1. 3) Accept header: Accept: application/vnd.api.v1+json (cleanest REST, harder to test). 4) Custom header: X-Api-Version: 1. URI versioning is most common and easiest to route at the gateway/proxy level."],
["How to implement pagination?","Pageable from Spring Data: GET /users?page=0&size=20&sort=name,asc. Return Page<T> with content, totalElements, totalPages, number. For large datasets or cursor-based: return a next cursor token (createdAt + id of last item) for keyset pagination — avoids full count queries."],
["What is HATEOAS?","Hypermedia As The Engine Of Application State: responses include links to related actions/resources. Clients navigate the API via links rather than hardcoded URLs. Spring HATEOAS library helps build EntityModel, CollectionModel with Link. Level 3 of Richardson Maturity Model."],
["How to secure a REST API?","Authentication: JWT Bearer tokens (stateless) or OAuth2 / OIDC. Use Spring Security. Authorization: method-level @PreAuthorize, role checks. HTTPS everywhere. Input validation (@Valid, @Validated). Rate limiting. CORS configuration. CSRF protection (stateful sessions only — not needed for stateless JWT APIs)."],
["What is content negotiation?","Client specifies desired format via Accept header (Accept: application/json). Server responds with Content-Type matching one of the accepted types. If no match, 406 Not Acceptable. Spring MVC uses HttpMessageConverters — MappingJackson2 for JSON, JAXB for XML."],
["How to implement idempotent POST?","Client sends a unique Idempotency-Key header. Server stores (key → response) in a distributed cache (Redis). On first request: process and store. On retry with same key: return cached response. The key should be a UUID generated by the client. Idempotency keys expire after a reasonable window."],
["What is CORS and how to configure it?","Cross-Origin Resource Sharing: browser policy blocking cross-origin XHR/fetch requests. Allow via: @CrossOrigin on controller methods, WebMvcConfigurer.addCorsMappings() globally, or Spring Security's cors() configuration. Configure allowed origins, methods, headers, and max-age for preflight caching."],
["Difference between PUT and PATCH?","PUT replaces the entire resource — omitted fields are set to null/default. PATCH applies a partial update — only provided fields are changed. PUT is idempotent; PATCH can be idempotent depending on implementation (JSON Patch is idempotent; JSON Merge Patch may not be)."],
["How to validate request bodies?","Add @Valid or @Validated to the @RequestBody parameter. Use Bean Validation annotations on the DTO: @NotBlank, @Email, @Min, @Max, @Size, @Pattern. Handle MethodArgumentNotValidException in @ControllerAdvice to return 400 with field-level error details."],
["What is the Richardson Maturity Model?","Level 0: single endpoint, action in body (RPC style). Level 1: separate resources (URIs). Level 2: HTTP verbs (GET/POST/PUT/DELETE) with correct semantics. Level 3: HATEOAS — responses include navigation links. Most production REST APIs operate at Level 2."],
],
scenarios:[
["Design a paginated endpoint that returns 10 million order records efficiently.","Do not use offset pagination (OFFSET 1000000 is slow — full table scan). Use keyset pagination: clients send the last seen (createdAt, id) pair; query uses WHERE (created_at, id) > (?, ?) ORDER BY created_at, id LIMIT 20. Return next cursor in response. Fast regardless of page depth."],
["A client retries a payment POST and double-charges the customer. How to fix?","Require clients to send an Idempotency-Key UUID header. Store (key → charged = true, response) in Redis with a 24h TTL. On retry: return cached response without re-charging. This is the standard pattern used by Stripe and other payment APIs."],
["How would you handle breaking vs non-breaking API changes?","Non-breaking: add optional fields, add new endpoints. Breaking: introduce a new version (v2). Keep v1 running with a deprecation notice and sunset header (Sunset: Sat, 01 Jan 2026 00:00:00 GMT). Never break existing clients without versioning."],
],
coding:[
["Global REST exception handler with ProblemDetail.","RFC 9457 standardised error body.",`@RestControllerAdvice
public class ApiExceptionHandler {

    @ExceptionHandler(ResourceNotFoundException.class)
    ProblemDetail handleNotFound(ResourceNotFoundException ex) {
        var pd = ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, ex.getMessage());
        pd.setTitle("Resource Not Found");
        return pd;
    }

    @ExceptionHandler(MethodArgumentNotValidException.class)
    ProblemDetail handleValidation(MethodArgumentNotValidException ex) {
        var pd = ProblemDetail.forStatus(HttpStatus.BAD_REQUEST);
        pd.setTitle("Validation Failed");
        pd.setProperty("errors", ex.getBindingResult().getFieldErrors()
            .stream().map(e -> e.getField() + ": " + e.getDefaultMessage())
            .toList());
        return pd;
    }
}`],

{id:"microservices",phase:"spring",title:"Microservices",tag:"Architecture",level:"advanced",
summary:"Service decomposition, communication, resilience, Saga, Outbox, CQRS, service mesh, and 12-factor principles.",
concepts:[
["Service Discovery","Services register with Eureka/Consul; callers resolve host+port dynamically."],
["API Gateway","Single entry point: routing, auth, rate limiting, SSL termination (Spring Cloud Gateway)."],
["Circuit Breaker","Prevent cascade failures: CLOSED → OPEN (stop calls) → HALF-OPEN (probe) pattern."],
["Saga Pattern","Distributed transaction via sequence of local transactions + compensating actions."],
["Outbox Pattern","Atomically write event to DB outbox table in same transaction; relay to Kafka."],
["CQRS","Command Query Responsibility Segregation: separate write and read models."],
["Event Sourcing","Store state as sequence of events; derive current state by replaying."],
["Idempotency","Consumers handle duplicate messages safely via deduplication key."],
["Service Mesh","Sidecar proxies (Envoy/Istio) handle mTLS, retries, tracing, circuit breaking."],
["12-Factor App","Methodology for cloud-native apps: config in env, stateless processes, etc."],
],
questions:[
["Microservices vs monolith — when to choose each?","Monolith: simpler to start, easier to debug, lower operational complexity — best for small teams and early-stage products. Microservices: independent deployment, technology flexibility, independent scaling — worth it only when the monolith becomes too complex to change safely or requires separate scaling. Never start with microservices."],
["How do services discover each other?","1) Client-side discovery: service registers with registry (Eureka/Consul); client queries registry and load-balances itself (Spring Cloud LoadBalancer). 2) Server-side discovery: load balancer (AWS ALB, Nginx) queries the registry; clients talk only to the LB. Kubernetes uses DNS-based service discovery natively."],
["What is a circuit breaker?","Prevents a slow/failing downstream service from cascading into full system outage. States: CLOSED (normal, calls pass through), OPEN (failure threshold exceeded — calls fail fast), HALF-OPEN (after wait, let a probe call through). Resilience4j and Spring Cloud CircuitBreaker provide this. Configure failure rate threshold, wait duration."],
["Saga pattern for distributed transactions?","Two approaches: 1) Choreography: each service publishes events; others react and may publish compensating events on failure — loose coupling, harder to debug. 2) Orchestration: a central saga orchestrator sends commands to services and handles compensating commands on failure — easier to reason about but coupling. Neither provides ACID — only eventual consistency."],
["What is the Outbox pattern?","Solves dual-write: writing to DB and publishing to Kafka must be atomic. Solution: write both DB state and an event record to an outbox table in the same local transaction. A relay (Debezium CDC or polling job) reads the outbox and publishes to Kafka, then marks entries processed. Guarantees at-least-once delivery."],
["What is CQRS?","Command Query Responsibility Segregation: use separate models (and optionally databases) for writes (commands) and reads (queries). Write model is normalised for consistency; read model is denormalised for query performance. Changes are propagated asynchronously (events). Adds complexity — use only when query and write models diverge significantly."],
["How do you handle data consistency across microservices?","Choose the right level: 1) Synchronous distributed transactions (2PC) — avoid, too fragile. 2) Saga (eventual consistency via compensating transactions). 3) Event sourcing. 4) Avoid cross-service transactions by designing service boundaries around aggregates. Each service owns its data."],
["What is event-driven architecture?","Services communicate by publishing and consuming events (via Kafka, RabbitMQ). Producers do not know consumers — loose coupling. Enables temporal decoupling and independent scaling. Challenges: eventual consistency, event ordering, duplicate handling, schema evolution. Idempotent consumers are mandatory."],
["What is a service mesh?","Infrastructure layer of sidecar proxies (Envoy/Linkerd) injected beside each service pod. Handles: mTLS, retries, circuit breaking, rate limiting, distributed tracing, traffic shaping — without code changes. Istio/Linkerd are popular. Adds operational complexity — worth it at scale."],
["What are the 12 factors for cloud-native apps?","I. Codebase (one codebase). II. Dependencies (declared). III. Config (in env vars). IV. Backing services (attached resources). V. Build/release/run (strict separation). VI. Processes (stateless). VII. Port binding (export via port). VIII. Concurrency (scale out). IX. Disposability (fast start/stop). X. Dev/prod parity. XI. Logs (streams). XII. Admin processes (run-once tasks)."],
["How to handle service failures (resilience patterns)?","Circuit breaker (Resilience4j). Retry with exponential backoff + jitter. Timeout: never wait indefinitely. Fallback: return cached/default data. Bulkhead: isolate thread pools per downstream. Rate limiter: cap calls per second. Combine: retry + circuit breaker together is the most common combination."],
["Synchronous vs asynchronous inter-service communication?","Synchronous (HTTP/gRPC): simpler, real-time response, but temporal coupling — if downstream is slow/down, the caller blocks or fails. Asynchronous (Kafka, AMQP): decoupled, more resilient, but eventual consistency, harder to debug. Use sync for queries requiring real-time data; async for commands and events."],
["What is idempotency in microservices?","Consumer processes each message at least once — duplicates are possible. Idempotent consumers must produce the same result regardless of how many times a message is processed. Strategies: check-then-process with a deduplication key (store processed message IDs in DB), natural idempotency (insert-or-update with upsert semantics)."],
["How to implement distributed tracing?","Assign a unique trace ID per request (at the gateway). Pass it in headers (W3C TraceContext: traceparent). Each service adds a span (start/end time, service name). Export to a backend: Zipkin, Jaeger, Tempo. Use Micrometer Tracing + Spring Cloud Sleuth (or native in Spring Boot 3.x) to auto-instrument Spring components."],
["What is API composition vs CQRS for query spanning services?","API composition: gateway/aggregator calls each service synchronously and merges results. Simple but adds latency and runtime coupling. CQRS with read database: maintain a materialized view in the query service (populated by consuming events from multiple services). Lower latency, decoupled, but eventual consistency."],
],
scenarios:[
["Order service writes to DB and publishes to Kafka. The Kafka publish fails. How to prevent inconsistency?","Use the Outbox pattern: in the same DB transaction, write the order and an event record to an outbox table. A CDC relay (Debezium) or polling publisher reads the outbox and publishes to Kafka, marking entries processed. Atomicity is guaranteed by the local transaction."],
["User service is slow and causing all callers to time out. How to protect callers?","Add a circuit breaker (Resilience4j) in each calling service. Set timeout = 2s, failure-rate threshold = 50%, wait-duration = 10s. When open, return a fallback response (cached data or error) immediately. Set bulkhead to isolate the thread pool used for User service calls from other calls."],
["Saga compensation: Payment service charged the customer but the downstream Inventory service failed.","Choreography saga: Inventory service publishes INVENTORY_FAILED event. Payment service listens and runs a compensating transaction (refund). Or orchestration: the saga orchestrator sends REFUND_PAYMENT command to Payment service. Record compensation status to avoid double-refund on retry."],
],
coding:[
["Resilience4j circuit breaker with fallback.","Protects downstream calls from cascading failure.",`@Service @RequiredArgsConstructor
public class UserClient {
    private final RestTemplate http;
    private final CircuitBreakerRegistry cbr;

    public UserDto getUser(Long id) {
        CircuitBreaker cb = cbr.circuitBreaker("userService");
        return cb.executeSupplier(
            () -> http.getForObject("/users/" + id, UserDto.class),
            ex -> new UserDto(id, "Unknown") // fallback
        );
    }
}`],
["Outbox table and polling publisher skeleton.","Atomically write event + data in one transaction.",`@Transactional
public void placeOrder(Order order) {
    orderRepo.save(order);
    outboxRepo.save(new OutboxEvent("ORDER_PLACED",
        objectMapper.writeValueAsString(new OrderPlacedEvent(order.getId()))));
}

// Polling publisher (runs every second)
@Scheduled(fixedDelay = 1000)
public void publishOutbox() {
    outboxRepo.findByPublishedFalse().forEach(e -> {
        kafka.send("orders", e.getPayload());
        e.setPublished(true);
        outboxRepo.save(e);
    });
}`],
]},
{id:"hibernate-jpa",phase:"spring",title:"Hibernate & Spring Data JPA",tag:"Persistence",level:"advanced",
summary:"Entity lifecycle, N+1 problem, lazy/eager loading, caching, OSIV, optimistic locking, and Spring Data repositories.",
concepts:[
["Persistence Context","First-level cache: within one EntityManager; tracks entity state."],
["Entity Lifecycle","New → Managed → Detached → Removed."],
["Lazy Loading","Association fetched on access; requires open persistence context."],
["Eager Loading","Association fetched in the same query as the owning entity."],
["N+1 Problem","1 query for N entities + N queries for each entity's association = N+1 queries."],
["Entity Graph","@EntityGraph / @NamedEntityGraph to fetch specific associations eagerly per query."],
["@BatchSize","Hibernate fetches associations in batches of N rather than one per entity."],
["First-Level Cache","EntityManager/Session scope; automatic in JPA."],
["Second-Level Cache","Shared across EntityManagers; ehcache/Hazelcast; opt-in with @Cacheable."],
["OSIV","Open Session In View: keeps EntityManager open in the web layer — anti-pattern at scale."],
["Optimistic Locking","@Version field; Hibernate checks version on UPDATE; throws OptimisticLockException on conflict."],
["Pessimistic Locking","Database-level row lock (SELECT FOR UPDATE); blocks concurrent reads/writes."],
],
questions:[
["What is JPA and what is Hibernate's role?","JPA (Jakarta Persistence API) is a specification for ORM in Java. Hibernate is the most popular JPA implementation — it maps Java classes to tables, generates SQL, and manages the persistence context. Spring Data JPA wraps JPA/Hibernate with repository abstractions (CrudRepository, JpaRepository)."],
["What is the entity lifecycle?","New (Transient): just created, not associated with any persistence context. Managed (Persistent): associated with an EntityManager; changes tracked and synchronised to DB on flush. Detached: persistence context closed; changes not tracked. Removed: scheduled for deletion on flush."],
["Lazy vs eager loading — which to use?","Lazy: association fetched on access (default for @OneToMany, @ManyToMany). Eager: association fetched in the same query (default for @ManyToOne, @OneToOne). Best practice: start with lazy everywhere and fetch eagerly per query using JPQL JOIN FETCH or Entity Graphs. Eager at the mapping level causes unexpected queries."],
["What is the N+1 select problem?","Executing 1 query to fetch N entities, then 1 additional query per entity to fetch its lazy association = N+1 queries total. Classic example: load 100 orders, then accessing order.getCustomer() fires 100 more queries. Detect with Hibernate statistics or sql logging. Fix with JOIN FETCH, Entity Graphs, or @BatchSize."],
["How to fix the N+1 problem?","1) JOIN FETCH in JPQL: SELECT o FROM Order o JOIN FETCH o.customer. 2) Entity Graph: @EntityGraph(attributePaths={\"customer\"}) on repository method. 3) @BatchSize(size=25) on the association — Hibernate loads 25 at once using an IN clause. 4) DTO projection with native query. 5) Spring Data @Query with fetch join."],
["What is an Entity Graph?","@NamedEntityGraph or @EntityGraph annotation specifying which associations to fetch eagerly for a particular query, overriding the default fetch type. Applied per query — does not pollute the mapping with global eager loading. Example: @EntityGraph(attributePaths = {\"orderItems\", \"orderItems.product\"})."],
["What is OSIV and why is it an anti-pattern?","Open Session In View keeps the EntityManager open for the entire HTTP request (including the view rendering phase). This allows lazy loading in templates but causes unexpected queries in the view layer, holds DB connections longer, hides the N+1 problem, and breaks in async contexts. Set spring.jpa.open-in-view=false. Load all needed data in the service layer."],
["What is the first-level cache?","EntityManager (Session) scoped cache: within a single transaction, loading the same entity by ID twice returns the same Java object — no second DB query. Automatic, cannot be disabled. Prevents duplicate inserts (merge uses it). Cleared on transaction end."],
["What is the second-level cache?","Shared cache across EntityManagers, process-scoped. Must be explicitly enabled: @Cacheable / @Cache annotation on the entity, plus a provider (EHcache, Hazelcast). Cache eviction policy is crucial. Use only for mostly-read, rarely-changed entities (reference data, configuration)."],
["What is optimistic locking?","@Version on a numeric or timestamp field. On UPDATE, Hibernate adds WHERE version = currentVersion. If no rows updated (someone else changed it), throws OptimisticLockException. No DB lock held — allows high concurrency. Appropriate for low-conflict scenarios (most web apps)."],
["What is pessimistic locking?","Database-level lock (SELECT FOR UPDATE). entityManager.find(Order.class, id, LockModeType.PESSIMISTIC_WRITE) or @Lock on a repository method. Blocks concurrent readers/writers. Use for high-contention scenarios (inventory decrement, ticket booking) where optimistic retries would cause too many failures."],
["What are Spring Data JPA repositories?","JpaRepository<T, ID> extends CrudRepository with pagination and batch operations. Method query derivation: findByNameAndStatus() generates JPQL automatically. @Query for custom JPQL or native SQL. @Modifying + @Query for UPDATE/DELETE. @EntityGraph for fetch strategy per method."],
["What is the difference between save() and saveAndFlush()?","save(): saves to persistence context (may batch with other pending changes, flushed before query or transaction commit). saveAndFlush(): immediately flushes to DB. Use saveAndFlush() when subsequent code (same transaction) needs to query the data just written, or for immediate constraint violation detection."],
["How does Hibernate handle lazy loading technically?","Hibernate replaces collection fields with Hibernate-specific proxy collections (PersistentBag, PersistentSet). When first accessed, the proxy fires a SELECT to load the data. Requires an open EntityManager — accessing a lazy association on a detached entity throws LazyInitializationException. Solution: load eagerly, or access within a transaction."],
["What is CascadeType and when to use it?","CascadeType.PERSIST: child saved with parent. MERGE: child merged with parent. REMOVE: child deleted with parent (use with caution on @ManyToMany). ALL: all cascade types. ORPHAN REMOVAL (@OneToMany(orphanRemoval=true)): child removed from collection is deleted. Only cascade for exclusive ownership relationships."],
],
scenarios:[
["Your API endpoint is slow — SQL logs show 150 queries for a 10-item list.","Classic N+1. Add a repository method with @EntityGraph(attributePaths={\"items\",\"customer\"}) or a JPQL JOIN FETCH query. Verify with Hibernate statistics. This reduces 150 queries to 1-3."],
["Concurrent users update the same account balance and sometimes overwrite each other.","Add @Version private Long version to the Account entity. When two threads read version=5, one succeeds (updates to version=6); the other receives OptimisticLockException. The service layer catches it and retries the operation. This prevents lost updates without DB-level locks."],
["After moving to async processing, Lazy loading fails with LazyInitializationException.","The async thread runs outside the original transaction — the EntityManager is closed. Fix: load all required data within the transaction (use JOIN FETCH or DTO projection), pass a DTO (not an entity) to the async method, or annotate the async method @Transactional (creates a new transaction)."],
],
coding:[
["Repository method with Entity Graph to avoid N+1.","Fetch associations per query without changing mapping.",`@Repository
public interface OrderRepository extends JpaRepository<Order, Long> {

    @EntityGraph(attributePaths = {"orderItems", "orderItems.product", "customer"})
    @Query("SELECT o FROM Order o WHERE o.status = :status")
    List<Order> findByStatusWithDetails(@Param("status") OrderStatus status);
}`],
["Optimistic locking retry in service layer.","Catch OptimisticLockException and retry.",`@Service @RequiredArgsConstructor
public class AccountService {
    private final AccountRepository repo;

    @Retryable(retryFor = OptimisticLockingFailureException.class, maxAttempts = 3)
    @Transactional
    public void debit(Long id, BigDecimal amount) {
        Account account = repo.findById(id).orElseThrow();
        account.debit(amount);           // @Version increments on save
        repo.save(account);
    }
}`],
["DTO projection with JPQL constructor expression.","Avoids loading full entity when only subset of fields needed.",`@Query("SELECT new com.example.dto.OrderSummary(o.id, o.status, c.name) " +
       "FROM Order o JOIN o.customer c WHERE o.createdAt > :since")
List<OrderSummary> findSummariesSince(@Param("since") Instant since);`],
]});
