{id:"sql",phase:"databases",title:"SQL",tag:"Databases",level:"intermediate",
summary:"Joins, indexes, query optimisation, transactions, isolation levels, and common SQL patterns.",
concepts:[
["Index","B-tree structure for fast row lookup; trades write overhead for read speed."],
["EXPLAIN / EXPLAIN ANALYZE","Show the query execution plan; identify seq scans and missing indexes."],
["Join Types","INNER, LEFT/RIGHT OUTER, FULL OUTER, CROSS, SELF."],
["GROUP BY / HAVING","Aggregate rows; HAVING filters aggregated groups (WHERE filters rows before grouping)."],
["Window Functions","ROW_NUMBER, RANK, DENSE_RANK, LAG, LEAD, NTILE over a PARTITION BY window."],
["CTE","Common Table Expression (WITH clause) for readability and recursive queries."],
["Subquery vs JOIN","Subquery inside SELECT/WHERE; often optimised to JOIN by the planner."],
["Isolation Level","READ UNCOMMITTED → READ COMMITTED → REPEATABLE READ → SERIALIZABLE."],
["ACID","Atomicity, Consistency, Isolation, Durability — properties of a DB transaction."],
["Normalisation","1NF, 2NF, 3NF: eliminate redundancy. Denormalise for read performance."],
],
questions:[
["Difference between INNER JOIN and LEFT JOIN?","INNER JOIN returns rows where both tables have a matching key. LEFT JOIN returns all rows from the left table plus matched rows from the right; unmatched right columns are NULL. Use LEFT JOIN to include rows with no related record (e.g., customers with no orders)."],
["What is a database index?","A B-tree (or hash/bitmap) data structure that maps index key values to row locations, enabling O(log n) lookup instead of O(n) sequential scan. Speeds up SELECT, WHERE, JOIN, ORDER BY. Costs: extra storage, slower INSERT/UPDATE/DELETE (index maintenance). Do not over-index write-heavy tables."],
["What is a covering index?","An index that contains all columns needed by a query — the DB can satisfy the query entirely from the index without touching the main table (index-only scan). Include extra columns with INCLUDE (PostgreSQL) or as composite index columns. Dramatically improves performance for read-heavy queries."],
["EXPLAIN and EXPLAIN ANALYZE?","EXPLAIN shows the estimated execution plan. EXPLAIN ANALYZE (PostgreSQL) actually executes the query and shows real times and row counts. Look for: Seq Scan on large tables (may need index), high-cost nodes, row count estimation errors, nested loop on large sets. Use to verify index usage."],
["Difference between WHERE and HAVING?","WHERE filters rows before grouping — cannot reference aggregate functions. HAVING filters groups after GROUP BY — can reference aggregates. Example: WHERE salary > 50000 filters employees; HAVING COUNT(*) > 5 filters departments with more than 5 employees."],
["What are window functions?","Aggregate-like functions that operate over a window of rows related to the current row: ROW_NUMBER(), RANK(), DENSE_RANK(), LAG(col, offset), LEAD(), SUM()/AVG() OVER (PARTITION BY dept ORDER BY salary). Do not collapse rows like GROUP BY. Used for running totals, rankings, time-series comparisons."],
["What are ACID properties?","Atomicity: transaction fully commits or fully rolls back. Consistency: transaction takes DB from one valid state to another. Isolation: concurrent transactions see a consistent view (level determines how much). Durability: committed transaction survives system crash (write-ahead log)."],
["Transaction isolation levels and anomalies?","Read Uncommitted: dirty reads possible. Read Committed (default in PostgreSQL): no dirty reads, phantom/non-repeatable reads possible. Repeatable Read: no non-repeatable reads, phantoms possible. Serializable: fully isolated — no anomalies, lowest concurrency. Higher isolation = fewer anomalies but more locking/blocking."],
["How do you optimise a slow query?","1) Run EXPLAIN ANALYZE to find the bottleneck. 2) Add indexes for WHERE, JOIN, ORDER BY columns. 3) Use covering indexes. 4) Rewrite correlated subqueries as JOINs. 5) Avoid functions on indexed columns in WHERE (prevents index use). 6) Break complex queries with CTEs. 7) Consider partitioning for very large tables."],
["What is normalisation?","Process of organising tables to reduce redundancy. 1NF: atomic column values, unique rows. 2NF: 1NF + no partial dependency on composite key. 3NF: 2NF + no transitive dependency. Denormalise (introduce redundancy) purposefully for read performance: materialised views, summary tables."],
["Difference between UNION and UNION ALL?","UNION removes duplicate rows (requires sort/hash dedup — slower). UNION ALL retains all rows including duplicates — faster. Use UNION ALL unless you need deduplication. Both require matching column count and compatible types."],
["What is a CTE (Common Table Expression)?","WITH clause that names a subquery for reuse within the main query. Improves readability. Recursive CTEs traverse hierarchical data (e.g., org charts, bill of materials): WITH RECURSIVE cte AS (anchor UNION ALL recursive part). PostgreSQL/SQL Server CTEs are not always materialised — the planner may inline them."],
["Clustered vs non-clustered index (SQL Server / MySQL InnoDB)?","Clustered: data rows are physically stored in index order — one per table (InnoDB primary key). Non-clustered: separate index structure pointing to row location. Lookups on non-clustered indexes may require an extra lookup (key lookup) to fetch non-indexed columns."],
["What is a deadlock in databases?","Two transactions each holding a lock the other needs, waiting forever. Database detects the cycle and kills one transaction (the victim). Prevent by: always accessing tables/rows in a consistent order, keeping transactions short, using appropriate isolation level, using SELECT FOR UPDATE to lock upfront."],
["What is an upsert?","INSERT OR UPDATE: if the row exists update it, otherwise insert. PostgreSQL: INSERT INTO ... ON CONFLICT (key) DO UPDATE SET ... MySQL: INSERT INTO ... ON DUPLICATE KEY UPDATE. Used for idempotent writes (message processing, cache population)."],
],
scenarios:[
["Find the second-highest salary in an employees table.","SELECT MAX(salary) FROM employees WHERE salary < (SELECT MAX(salary) FROM employees). Or with window function: SELECT DISTINCT salary FROM (SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) r FROM employees) t WHERE r = 2."],
["Find all customers who have never placed an order.","SELECT c.* FROM customers c LEFT JOIN orders o ON c.id = o.customer_id WHERE o.id IS NULL. Alternative: SELECT * FROM customers WHERE id NOT IN (SELECT customer_id FROM orders)."],
["Table has 10 million rows and a query on a non-indexed column is slow.","Add an index: CREATE INDEX ON orders(status) or a composite index if multiple columns are in WHERE. Run EXPLAIN ANALYZE to verify index scan is used. Consider a partial index if most rows share one value: CREATE INDEX ON orders(created_at) WHERE status != 'COMPLETED'."],
],
coding:[
["Running total of sales per month (window function).","Cumulative SUM with OVER ORDER BY.",`SELECT
  month,
  revenue,
  SUM(revenue) OVER (ORDER BY month ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_total
FROM monthly_sales
ORDER BY month;`],
["Find duplicate emails in a users table.","GROUP BY with HAVING COUNT.",`SELECT email, COUNT(*) cnt
FROM users
GROUP BY email
HAVING COUNT(*) > 1
ORDER BY cnt DESC;`],
["Recursive CTE to traverse an org chart.","Manager hierarchy using WITH RECURSIVE.",`WITH RECURSIVE org AS (
  SELECT id, name, manager_id, 0 AS depth
  FROM employees WHERE manager_id IS NULL
  UNION ALL
  SELECT e.id, e.name, e.manager_id, o.depth + 1
  FROM employees e JOIN org o ON e.manager_id = o.id
)
SELECT * FROM org ORDER BY depth, name;`],
]},
{id:"mongodb",phase:"databases",title:"MongoDB",tag:"Databases",level:"intermediate",
summary:"Document model, CRUD, aggregation pipeline, indexing, replication, sharding, and schema design.",
concepts:[
["Document","BSON key-value record; nested documents and arrays; schema-flexible."],
["Collection","Group of documents (analogous to a SQL table)."],
["_id","Mandatory unique identifier; default ObjectId (timestamp + random)."],
["Aggregation Pipeline","Sequence of stages ($match, $group, $project, $sort, $lookup) for data transformation."],
["Index Types","Single, compound, multikey (array), text, geospatial, TTL."],
["$lookup","Left outer join between collections inside aggregation pipeline."],
["Replica Set","Primary + secondaries; automatic failover; read from secondaries for scale."],
["Sharding","Horizontal partitioning by shard key; routes reads/writes to correct shard."],
["Transactions","Multi-document ACID transactions across a replica set (MongoDB 4.0+)."],
["Embedding vs Referencing","Embed for data accessed together (better read performance); reference for large/frequently-updated sub-documents."],
],
questions:[
["Difference between SQL and MongoDB data model?","SQL: fixed schema, normalised tables, JOINs. MongoDB: flexible document schema, nested documents and arrays, no joins (or $lookup for aggregation). Best fit for MongoDB: variable/evolving schemas, hierarchical data, high write throughput, horizontal scaling."],
["When to embed vs reference in MongoDB?","Embed: data accessed together, one-to-few relationships, sub-document is owned by the parent (address, orderItems). Reference (store ObjectId): large sub-documents, frequently updated independently, one-to-many or many-to-many, need to query the sub-document independently."],
["What is the aggregation pipeline?","A sequence of stages that transform documents: $match (filter), $group (aggregate), $project (reshape), $sort, $limit, $skip, $lookup (join), $unwind (flatten array), $addFields, $bucket. More powerful and composable than MapReduce. Use $match early to reduce documents flowing through subsequent stages."],
["What are MongoDB index types?","Single-field, compound (multiple fields — order and direction matter), multikey (indexes each element of an array field), text (full-text search), 2dsphere/2d (geospatial), wildcard (indexes all fields), partial (filtered subset of documents), TTL (auto-deletes documents after a time)."],
["How do MongoDB transactions work?","Multi-document ACID transactions available on replica sets (4.0+) and sharded clusters (4.2+). Start session, beginTransaction, perform CRUD ops, commit or abort. Same semantics as SQL transactions. Performance overhead — use for cases where atomicity across multiple documents is essential. Design schema to minimise need for transactions."],
["What is a replica set?","A group of MongoDB instances maintaining the same data. One primary receives all writes; secondaries replicate asynchronously. On primary failure, secondaries elect a new primary within ~10s. Read preference can be set to route reads to secondaries (PRIMARY, SECONDARY, NEAREST). Minimum 3 nodes recommended for quorum."],
["What is sharding?","Horizontal partitioning across multiple machines by a shard key. The mongos router directs reads/writes to the correct shard based on the key. Good shard key: high cardinality, low correlation with query patterns, write distribution. Bad shard key: monotonically increasing (_id as ObjectId — causes hotspot shard). Use hashed shard key to distribute evenly."],
["How to perform a full-text search in MongoDB?","Create a text index: db.articles.createIndex({title: \"text\", body: \"text\"}). Query with $text: {$search: \"java concurrency\"}. Returns scored results sorted by relevance. For advanced search (fuzzy matching, facets) use Atlas Search or Elasticsearch. Text indexes do not support regex or partial matches."],
["Difference between find() and aggregate()?","find() is a simple query returning documents matching a filter. aggregate() runs a multi-stage pipeline capable of reshaping, grouping, joining, and computing across documents. Use find() for simple reads; aggregate() for analytics, group-by, $lookup joins, computed fields."],
["What is $lookup?","Stage in the aggregation pipeline performing a left outer join with another collection. `$lookup: {from: \"users\", localField: \"userId\", foreignField: \"_id\", as: \"user\"}`. Can also use a pipeline-based lookup for complex join conditions. Alternative to embedding when referencing is preferred."],
["What is a TTL index?","An index with an expireAfterSeconds option on a Date field. MongoDB automatically deletes documents when their date value is older than the TTL. Used for sessions, cache entries, audit logs, temporary data. TTL cleanup runs in the background every ~60s."],
["Optimistic concurrency in MongoDB?","No built-in @Version. Pattern: add a version field to documents, use findOneAndUpdate with a filter including the expected version, and increment version in $set. If the version does not match (document was updated by another writer), the update returns null — no document was modified. Retry in the application."],
["What is upsert in MongoDB?","Update with {upsert: true}: if no document matches the filter, insert a new document with the update fields. db.users.updateOne({email: x}, {$set: {name: y}}, {upsert: true}). Useful for idempotent writes."],
["Schema validation in MongoDB?","db.createCollection with a JSON Schema validator ($jsonSchema). Enforces field types, required fields, value ranges. Set validationAction: \"error\" to reject invalid documents. Use validationLevel: \"moderate\" to validate new writes but not existing documents."],
],
scenarios:[
["Design a schema for a blog with posts, comments, and authors.","Embed comments inside posts (accessed together, owned by post). Reference authors by _id (many posts per author, author data updated independently). Index posts.authorId and posts.tags. If comments grow large (thousands per post), split into a separate comments collection with a postId reference."],
["Aggregate to find the top 5 authors by total post views.","db.posts.aggregate([ {$group: {_id: \"$authorId\", totalViews: {$sum: \"$views\"}}}, {$sort: {totalViews: -1}}, {$limit: 5}, {$lookup: {from: \"users\", localField: \"_id\", foreignField: \"_id\", as: \"author\"}} ])"],
["Your MongoDB queries are slow on a large collection. How to diagnose?","Run db.collection.explain(\"executionStats\").find(query) — look for COLLSCAN (collection scan) vs IXSCAN. Create compound index matching the query fields and sort order. Use $match early in aggregation. Consider partial indexes if only a subset of documents is queried."],
],
coding:[
["Aggregation: average order value by customer country.","$lookup + $group + $project.",`db.orders.aggregate([
  { $lookup: {
      from: "customers", localField: "customerId",
      foreignField: "_id", as: "customer" }},
  { $unwind: "$customer" },
  { $group: {
      _id: "$customer.country",
      avgValue: { $avg: "$total" },
      orderCount: { $sum: 1 }}},
  { $sort: { avgValue: -1 }},
  { $limit: 10 }
])`],
["Create a TTL index to auto-expire sessions.","TTL index on a Date field.",`db.sessions.createIndex(
  { lastAccessedAt: 1 },
  { expireAfterSeconds: 3600 }  // expire 1 hour after last access
);`],
]},
{id:"kafka",phase:"messaging",title:"Apache Kafka",tag:"Messaging",level:"advanced",
summary:"Topics, partitions, consumer groups, offsets, delivery guarantees, Schema Registry, Streams, and Spring Kafka.",
concepts:[
["Topic","Named log of immutable ordered records; divided into partitions."],
["Partition","Ordered, immutable sequence of records; unit of parallelism and ordering."],
["Offset","Record's position in a partition; consumer tracks its committed offset."],
["Consumer Group","Group of consumers sharing partition assignments; each partition to one consumer."],
["At-least-once","Default delivery: messages delivered ≥ once; duplicates possible; consumer must be idempotent."],
["Exactly-once","Idempotent producer + transactional API; each message processed exactly once."],
["Producer Acks","acks=0 (fire-and-forget), acks=1 (leader), acks=all (all in-sync replicas — no data loss)."],
["Replication","Topic replication factor N; N-1 broker failures tolerated."],
["Schema Registry","Centralised schema management (Avro/Protobuf/JSON Schema); consumers validate messages."],
["Consumer Lag","How far a consumer is behind the latest offset; monitored with kafka-consumer-groups."],
],
questions:[
["What is Apache Kafka and when to use it?","Kafka is a distributed, durable, high-throughput event streaming platform. Use for: decoupling microservices (async events), event sourcing, activity tracking (clickstreams), metrics/log aggregation, stream processing. Not suited for: simple task queues where messages should be deleted after processing, real-time request-response."],
["Topic, partition, and offset?","Topic: named stream of records (like a log file). Partition: a topic is split into N ordered, immutable logs — the unit of parallelism. Offset: position of a record in a partition (0, 1, 2, …). Consumers track offsets to know where they are. Ordering is guaranteed within a partition, not across partitions."],
["What is a consumer group?","A set of consumers that jointly consume a topic. Kafka assigns each partition to exactly one consumer in the group — parallelism scales with partition count. If consumer count > partitions, extra consumers are idle. Multiple groups can consume the same topic independently (each has its own committed offsets)."],
["At-least-once vs exactly-once delivery?","At-least-once (default): producer retries on failure; consumer commits offset after processing. Duplicates possible — consumer must be idempotent. Exactly-once: requires idempotent producer (enable.idempotence=true) + transactional producer API (atomic consume-transform-produce). Supported end-to-end in Kafka Streams. Higher complexity and slight overhead."],
["What are acks settings in a Kafka producer?","acks=0: fire-and-forget — fastest, possible message loss. acks=1: leader broker acknowledges — leader loss can lose unacked messages. acks=all (or -1): leader + all in-sync replicas acknowledge — no data loss on broker failure (combine with min.insync.replicas=2). Use acks=all for production."],
["How does Kafka guarantee ordering?","Ordering is guaranteed within a partition. All messages with the same key go to the same partition (key hash). Design: use the entity ID (order ID, user ID) as the key to ensure ordered processing per entity. If you need global ordering, use a single partition (sacrifices throughput)."],
["What is consumer lag?","The difference between the latest offset in a partition and the consumer's committed offset. High lag means the consumer is falling behind. Monitor with kafka-consumer-groups.sh --describe or Prometheus metrics. Alert on sustained high lag. Causes: slow processing, consumer crash, too few consumers vs partitions."],
["What is the Kafka retention policy?","Kafka retains messages for a configured time (log.retention.hours, default 7 days) or size (log.retention.bytes). After expiry, segments are deleted. Consumers can replay history within the retention window. Compact topics (log.cleanup.policy=compact) retain only the latest value per key — for changelog / materialised views."],
["How does Kafka handle replication and fault tolerance?","Each partition has a replication factor (RF). One broker is the leader; others are followers (ISR = In-Sync Replicas). Producers write to the leader; followers replicate. If the leader fails, Zookeeper/KRaft elects a new leader from the ISR. Data loss only if RF-1 brokers fail simultaneously. Set RF=3 and min.insync.replicas=2 for production."],
["What is Schema Registry?","Centralised service (Confluent Schema Registry) storing Avro/Protobuf/JSON Schema schemas. Producers register schema; consumers validate messages against it. Subject naming strategies control schema evolution. Compatibility modes: BACKWARD (new schema can read old), FORWARD (old schema can read new), FULL. Prevents schema drift breaking consumers."],
["What is Kafka Streams?","A client-side stream processing library using Kafka as source and sink. KStream (record stream), KTable (changelog / materialised view), GlobalKTable. Operations: map, filter, flatMap, join, groupBy, aggregate, window. Stateful operators store state in RocksDB (local) + changelog topic (durable). No separate cluster needed."],
["How to implement idempotent Kafka consumers?","Track processed message IDs in a database or Redis (key = topic:partition:offset or a business-level deduplication key). Before processing, check if already processed; skip if so. After processing, store the ID. Use a unique constraint on the deduplication key to handle concurrent processing."],
["What is a dead letter topic?","A topic where unprocessable messages are sent after N retry attempts. Prevents one bad message from blocking partition processing indefinitely. Consumers should log the failure reason. A separate process can inspect and replay dead letter messages after the bug is fixed."],
["What is Kafka Connect?","A framework for connecting Kafka to external systems (databases, S3, Elasticsearch) with ready-made connectors. Source connector: pulls data from external system into Kafka. Sink connector: pushes data from Kafka to external system. Debezium is a popular CDC source connector for databases."],
],
scenarios:[
["Your Kafka consumer is slow and consumer lag keeps growing. How do you fix?","1) Increase consumer count (up to partition count). 2) Increase partitions (requires rebalance). 3) Optimise processing logic (batch DB writes, async I/O). 4) Check if the consumer is doing synchronous I/O per message — batch it. 5) Monitor GC pauses or thread starvation."],
["A Kafka consumer crashes mid-processing. How do you avoid re-processing messages on restart?","Commit offsets only after successful processing (manual commit: commitSync/commitAsync). Do NOT auto-commit (enable.auto.commit=true) with slow processing — it can commit offsets before processing completes. For exactly-once, use the transactional producer API: consume, process, produce, commit in one transaction."],
["You need to process events from Kafka and update a database atomically.","Option 1: Use Kafka's transactional API (consume-transform-produce) for Kafka-to-Kafka exactly-once. Option 2: Idempotent consumer with a deduplication key stored in the same DB transaction as the business update. The deduplication check and business update are atomic — prevents double-processing on retry."],
],
coding:[
["Spring Kafka consumer with manual offset commit.","Only commit after successful processing.",`@KafkaListener(topics = "orders", groupId = "order-processor",
               containerFactory = "manualAckFactory")
public void consume(ConsumerRecord<String, String> record,
                    Acknowledgment ack) {
    try {
        processOrder(record.value());
        ack.acknowledge();          // commit only on success
    } catch (RetryableException e) {
        // don't ack — will be redelivered
    } catch (PoisonPillException e) {
        log.error("Dead letter: {}", record, e);
        ack.acknowledge();          // skip unrecoverable message
    }
}`],
["Kafka Streams: count events per key in a 1-minute tumbling window.","KStream → groupByKey → windowedBy → count → toStream.",`StreamsBuilder builder = new StreamsBuilder();
builder.stream("clicks", Consumed.with(Serdes.String(), Serdes.String()))
    .groupByKey()
    .windowedBy(TimeWindows.ofSizeWithNoGrace(Duration.ofMinutes(1)))
    .count()
    .toStream()
    .map((wk, cnt) -> new KeyValue<>(wk.key(), cnt.toString()))
    .to("click-counts", Produced.with(Serdes.String(), Serdes.String()));`],
]},
{id:"testing",phase:"practice",title:"Testing (JUnit & Mockito)",tag:"Quality",level:"intermediate",
summary:"Unit testing, mocking, test slices, test-driven development, and testing Spring Boot applications.",
concepts:[
["Unit Test","Tests one class in isolation; all dependencies mocked."],
["Integration Test","Tests multiple components together; may use real DB (H2 / TestContainers)."],
["@ExtendWith(MockitoExtension.class)","Enables Mockito annotations in JUnit 5."],
["@Mock","Creates a mock of a class/interface."],
["@InjectMocks","Creates the class under test and injects @Mock/@Spy fields."],
["when/thenReturn","Stubs a method to return a specified value."],
["verify()","Asserts that a method was called (optionally with specific args/count)."],
["@SpringBootTest","Full application context integration test."],
["@WebMvcTest","Lightweight controller-only Spring test with MockMvc."],
["TestContainers","Spins up real Docker containers (PostgreSQL, Kafka) for integration tests."],
],
questions:[
["What is the testing pyramid?","Unit tests (many, fast, cheap): test one class in isolation. Integration tests (fewer, slower): test components together with real infrastructure. E2E tests (fewest, slowest): test the full system. Invest heavily in unit tests; use integration tests for critical paths; E2E for smoke tests only."],
["Difference between @Mock and @Spy?","@Mock: creates a full mock — all methods return default values (null, 0, false) unless stubbed. @Spy: creates a partial mock wrapping a real object — unstubbed methods call the real implementation. Use @Spy when you want to test the real method but intercept/verify specific calls."],
["Difference between when/thenReturn and doReturn/when?","when(mock.method()).thenReturn(val): type-safe; calls the method once during stubbing — problematic if the method throws or has side effects. doReturn(val).when(mock).method(): does not call the method during stubbing; use for void methods, final methods, or when thenReturn causes issues."],
["What is ArgumentCaptor?","Mockito utility to capture arguments passed to a mock. `ArgumentCaptor<User> captor = ArgumentCaptor.forClass(User.class); verify(emailService).sendWelcome(captor.capture()); assertEquals(\"alice\", captor.getValue().getName());`. Use when you cannot conveniently pass the expected value as a verify argument."],
["What are @WebMvcTest and MockMvc?","@WebMvcTest creates a minimal Spring context (only controllers, filters, advice — no service/repo beans). MockMvc lets you fire HTTP requests against the controller without a real server. Use @MockBean to inject mock services. Fast, focused controller tests."],
["What is @DataJpaTest?","Loads only JPA-related beans (entities, repositories) with an in-memory H2 database by default. Transactions are rolled back after each test. Use for repository layer tests without starting the full context. Use @AutoConfigureTestDatabase(replace=NONE) + TestContainers for real DB tests."],
["What is TestContainers?","A Java library that starts real Docker containers for tests: `@Container static PostgreSQLContainer<?> pg = new PostgreSQLContainer<>(\"postgres:15\")`. Each test gets a real database (or Kafka, Redis, etc.). More reliable than H2 (uses production database dialect). Tests run in-process; container auto-starts and stops."],
["What is TDD?","Test-Driven Development: write a failing test first (Red), write minimal code to pass it (Green), refactor (Refactor). Benefits: forces clear specification before implementation, creates a comprehensive test suite naturally, improves design (testable code tends to be well-designed). Not always appropriate — good for algorithms and business logic."],
["What is @ParameterizedTest?","JUnit 5 annotation to run a test multiple times with different inputs. Sources: @ValueSource, @CsvSource, @MethodSource (returns a Stream of Arguments), @EnumSource. Reduces duplication when testing the same logic with different data points."],
["How to test @Transactional code?","For integration tests, use @Transactional on the test — Spring rolls back after each test. For unit tests, mock the repository. For testing actual transaction behaviour (rollback on exception, propagation), write an integration test that deliberately triggers the rollback condition and asserts the state."],
["What is @MockBean vs @Mock?","@MockBean (Spring Boot): creates a Mockito mock and registers it in the Spring application context (replaces the existing bean). Use in @SpringBootTest or @WebMvcTest. @Mock (Mockito): creates a mock without Spring context involvement — use in pure unit tests with @ExtendWith(MockitoExtension.class)."],
["AssertJ vs JUnit assertions?","JUnit 5: assertEquals, assertTrue, assertThrows — basic. AssertJ: fluent, readable: assertThat(list).hasSize(3).contains(\"a\").doesNotContain(\"x\"). assertThat(exception).isInstanceOf(X.class).hasMessage(). AssertJ produces better failure messages and is more composable. Prefer AssertJ."],
["How to verify exception is thrown?","JUnit 5: `assertThrows(OrderNotFoundException.class, () -> service.getOrder(-1L))`. With AssertJ: `assertThatThrownBy(() -> service.getOrder(-1L)).isInstanceOf(OrderNotFoundException.class).hasMessage(\"Order -1 not found\")`. Do not use @Test(expected=...) — it's JUnit 4 style."],
["What is a contract test (Pact)?","Tests that verify the contract between a consumer and a provider without deploying both. Consumer defines expectations (Pact file); provider verifies against them. Prevents consumer/provider drift in microservices. Run in CI on both sides."],
],
scenarios:[
["Write a unit test for an OrderService that depends on OrderRepository and EmailService.","Annotate test class with @ExtendWith(MockitoExtension.class). @Mock OrderRepository and @Mock EmailService. @InjectMocks OrderService. Stub repo.findById, call service method, verify email was sent with ArgumentCaptor."],
["Your integration tests are slow because they restart the Spring context for each test class.","Add @DirtiesContext(classMode=AFTER_CLASS) only when the test modifies context state. Otherwise Spring caches the context across tests with identical config. Group tests that share the same config into one class. Use @WebMvcTest / @DataJpaTest slices instead of @SpringBootTest for most tests."],
],
coding:[
["Unit test for OrderService.placeOrder().","Mock dependencies, verify interactions.",`@ExtendWith(MockitoExtension.class)
class OrderServiceTest {
    @Mock OrderRepository orderRepo;
    @Mock EmailService emailService;
    @InjectMocks OrderService orderService;

    @Test
    void placeOrder_savesOrderAndSendsEmail() {
        Order order = new Order("ITEM-1", 2);
        when(orderRepo.save(any())).thenReturn(order);

        orderService.placeOrder(order);

        verify(orderRepo).save(order);
        ArgumentCaptor<String> email = ArgumentCaptor.forClass(String.class);
        verify(emailService).sendConfirmation(email.capture());
        assertThat(email.getValue()).contains("ITEM-1");
    }
}`],
["Parameterised test for input validation.","@CsvSource covers multiple input cases concisely.",`@ParameterizedTest
@CsvSource({
    "alice@example.com, true",
    "not-an-email,       false",
    ",                  false"
})
void validateEmail(String email, boolean expected) {
    assertThat(emailValidator.isValid(email)).isEqualTo(expected);
}`],
["TestContainers PostgreSQL integration test.","Real DB test without H2 quirks.",`@SpringBootTest
@Testcontainers
class OrderRepositoryIT {
    @Container
    static PostgreSQLContainer<?> pg =
        new PostgreSQLContainer<>("postgres:15");

    @DynamicPropertySource
    static void props(DynamicPropertyRegistry r) {
        r.add("spring.datasource.url", pg::getJdbcUrl);
        r.add("spring.datasource.username", pg::getUsername);
        r.add("spring.datasource.password", pg::getPassword);
    }

    @Autowired OrderRepository repo;

    @Test
    void saveAndFind() {
        repo.save(new Order("ITEM-1", 1));
        assertThat(repo.count()).isEqualTo(1);
    }
}`],
]},
{id:"design-patterns",phase:"practice",title:"Design Patterns & SOLID",tag:"Architecture",level:"intermediate",
summary:"SOLID principles, Gang of Four creational/structural/behavioural patterns, and when to apply them.",
concepts:[
["Single Responsibility","A class should have one reason to change."],
["Open/Closed","Open for extension, closed for modification — extend via abstraction."],
["Liskov Substitution","Subtypes must be substitutable for their base types without altering correctness."],
["Interface Segregation","Prefer many small interfaces over one large one."],
["Dependency Inversion","Depend on abstractions, not concretions; inject dependencies."],
["Strategy","Encapsulates interchangeable algorithms behind a common interface."],
["Observer","Subject notifies registered observers of state changes."],
["Factory Method / Abstract Factory","Delegate object creation to subclasses or factory classes."],
["Builder","Construct complex objects step-by-step, separating construction from representation."],
["Decorator","Attach additional behaviour to objects dynamically by wrapping them."],
["Singleton","Single instance per JVM — use sparingly; prefer DI framework management."],
["Command","Encapsulates a request as an object; supports undo, queue, log."],
["Template Method","Skeleton algorithm in base class; subclasses override specific steps."],
],
questions:[
["Explain the SOLID principles.","S: Single Responsibility — one class, one reason to change. O: Open/Closed — open for extension (add new subclass/decorator), closed for modification (don't change existing code). L: Liskov Substitution — subtype can replace base type without breaking callers. I: Interface Segregation — many focused interfaces > one fat interface. D: Dependency Inversion — depend on interfaces/abstractions, inject dependencies."],
["Strategy pattern — example?","Define an interface (SortStrategy.sort(list)), multiple implementations (QuickSort, MergeSort, BubbleSort). The context (Sorter) holds a reference to SortStrategy. The algorithm can be swapped at runtime. Java example: Comparator passed to sort() is a Strategy. Spring's AuthenticationProvider is a Strategy."],
["Observer pattern — where is it used in Java?","Publisher/Subscriber: subject maintains a list of observers and notifies them on state change. Java: PropertyChangeListener, EventListener, Observer (deprecated). Spring: ApplicationEvent / @EventListener. Reactive: Reactor's Mono/Flux are push-based observable streams."],
["Factory Method vs Abstract Factory?","Factory Method: defines an interface for creating one product — subclasses decide which class to instantiate. Abstract Factory: creates families of related products — if you change the factory, all related products change together (e.g., SwingWidgetFactory, WebWidgetFactory). Use Factory Method for one product hierarchy; Abstract Factory for related families."],
["What is the Builder pattern?","Constructs complex objects step by step. The builder collects configuration, then build() creates the object. Useful when: constructor would have many parameters, some optional. Lombok @Builder generates this automatically. Example: StringBuilder, AlertDialog.Builder, HttpRequest.Builder."],
["Decorator vs Inheritance for adding behaviour?","Decorator: wraps an object and adds behaviour at runtime — composable, combinable, no class explosion. Inheritance: adds behaviour statically — simpler but rigid, combinatorial explosion of subclasses. Java I/O streams are classic decorators: BufferedInputStream wraps FileInputStream. Use Decorator when behaviour combinations vary."],
["Difference between Proxy, Decorator, and Adapter?","Proxy: controls access to the real object (virtual proxy, security proxy, caching proxy) — same interface. Decorator: adds behaviour — same interface but transparently wraps. Adapter: converts one interface to another (incompatible interfaces). Spring AOP creates JDK/CGLIB proxies. Jackson's ObjectMapper is an Adapter from JSON to Java objects."],
["Template Method pattern?","Defines the algorithm skeleton in a base class method (final, not overridable). Abstract methods are the variable steps — subclasses provide them. Example: AbstractList implements add() algorithm using abstract get(int index) and size(). Use when multiple classes share the same algorithm structure but differ in specific steps."],
["Command pattern and its uses?","Encapsulates a request as an object (Command interface with execute()/undo()). Enables: queuing, scheduling, logging, undo/redo. Example: Spring Batch Step implements Command. UI action buttons. Java's Runnable is a simplified Command. Full Command stores receiver, action, and parameters."],
["When would you violate SOLID intentionally?","Single Responsibility: sometimes it is pragmatic to keep related operations together to avoid over-engineering. LSP: if a subtype cannot fully substitute the parent, the hierarchy is wrong — fix the design. DIP: for simple scripts or bootstrapping code, concrete classes are fine. SOLID is a heuristic, not a law — apply judgment based on the complexity and longevity of the code."],
["Composite pattern?","Treats individual objects and compositions of objects uniformly. Component interface implemented by both Leaf and Composite (which contains children). Example: filesystem (File and Directory both implement FSNode), UI component hierarchy (widget contains widgets). Enables recursive traversal via accept()."],
["Flyweight pattern?","Shares intrinsic (shared, immutable) state between many objects, keeping extrinsic state outside. Example: String pool, Integer cache (−128 to 127), emoji rendering in browsers. Use when you need millions of similar objects and memory is constrained."],
["What is the difference between CQRS and Event Sourcing?","CQRS: separates read and write models. Event Sourcing: stores state as a sequence of events rather than a current-state snapshot. They are complementary but independent. CQRS without Event Sourcing: separate read DB updated by events. Event Sourcing without CQRS: single event-sourced aggregate with one query model."],
],
scenarios:[
["Add logging, metrics, and caching to a service without touching its code.","Use the Decorator pattern: wrap the service with a LoggingOrderService, MeteredOrderService, and CachingOrderService — each implements the same interface. Apply with Spring AOP (logging/metrics aspects) or manual decoration. No code changes to the original service."],
["You need to support multiple payment gateways (Stripe, PayPal, Braintree) interchangeably.","Define a PaymentGateway interface with charge(amount, details). Create one implementation per gateway. Inject the correct implementation via a factory or Spring @Profile/@Conditional. This is the Strategy pattern — the calling code depends on the interface, not the concrete gateway."],
["A class has 15 constructor parameters, half optional.","Apply the Builder pattern. Create a static inner Builder class with methods for each parameter (all return Builder for chaining). build() validates required fields and constructs the object. Lombok @Builder generates this. The resulting object can be immutable."],
],
coding:[
["Strategy pattern: pluggable discount rules.","Interface + implementations + context.",`interface DiscountStrategy { double apply(double price); }

class PremiumDiscount   implements DiscountStrategy { public double apply(double p) { return p * 0.8;  } }
class SeasonalDiscount  implements DiscountStrategy { public double apply(double p) { return p * 0.9;  } }
class NoDiscount        implements DiscountStrategy { public double apply(double p) { return p;        } }

class PriceCalculator {
    private final DiscountStrategy strategy;
    PriceCalculator(DiscountStrategy s) { this.strategy = s; }
    double calculate(double price)      { return strategy.apply(price); }
}`],
["Builder for immutable Request object.","Type-safe multi-param construction.",`public final class ApiRequest {
    private final String url;
    private final String method;
    private final Map<String,String> headers;
    private final int timeoutMs;

    private ApiRequest(Builder b) {
        this.url=b.url; this.method=b.method;
        this.headers=Map.copyOf(b.headers); this.timeoutMs=b.timeoutMs;
    }

    public static class Builder {
        private String url, method="GET";
        private Map<String,String> headers = new HashMap<>();
        private int timeoutMs = 5000;
        public Builder url(String u)        { url=u; return this;     }
        public Builder method(String m)     { method=m; return this;  }
        public Builder header(String k,String v){ headers.put(k,v); return this; }
        public Builder timeout(int ms)      { timeoutMs=ms; return this; }
        public ApiRequest build()           { Objects.requireNonNull(url); return new ApiRequest(this); }
    }
}`],
]},
{id:"coding-round",phase:"practice",title:"Coding Round Problems",tag:"Algorithms",level:"intermediate",
summary:"Common LeetCode-style patterns: arrays, strings, hashmaps, two pointers, sliding window, BFS/DFS, DP, and sorting.",
concepts:[
["Two Pointers","Left/right pointers converging or same-direction; O(n) for sorted array problems."],
["Sliding Window","Fixed or variable window over sequence; track window state without recomputing."],
["HashMap Frequency","Count occurrences in O(n); find pairs, anagrams, duplicates."],
["BFS","Level-by-level graph/tree traversal using a Queue; finds shortest path."],
["DFS","Depth-first traversal using Stack/recursion; path finding, cycle detection, topology."],
["Binary Search","O(log n) search on sorted arrays; also works on answer-space problems."],
["Dynamic Programming","Break into sub-problems; use memoisation or tabulation to avoid recomputation."],
["Sorting","QuickSort O(n log n) avg, MergeSort O(n log n) stable, counting/radix for limited range."],
["Linked List","Two-pointer technique for cycle detection, middle finding, reversal."],
["Stack","Monotonic stack for next greater element, balanced parentheses, expression evaluation."],
],
questions:[
["How do you detect a cycle in a linked list?","Floyd's algorithm: two pointers (slow = 1 step, fast = 2 steps). If they meet, a cycle exists. Finding cycle start: once they meet, move one pointer to head; advance both one step at a time — they meet at the cycle start. O(n) time, O(1) space."],
["How to find the longest substring without repeating characters?","Sliding window + HashSet. Expand right pointer; if char is in set, shrink left pointer until it is removed. Track max window size. O(n) time, O(min(n, 26)) space for lowercase letters."],
["How to check balanced parentheses?","Use a Stack. Iterate characters: push opening brackets. On closing bracket, pop from stack and check it matches. After iteration, stack must be empty. O(n) time, O(n) space."],
["Binary search on a rotated sorted array?","Use binary search with extra condition: determine which half is sorted. If left half is sorted and target is in that range, search left; otherwise search right. O(log n) time."],
["Merge two sorted arrays in-place.","For arrays where the first has extra space: use two pointers from the end of each array and fill from the back of the first array. No extra space needed. O(m+n) time."],
["Traverse a binary tree level by level.","BFS with a Queue: add root; while queue not empty, poll node, process it, add its children. Queue size at each step = number of nodes at that level. Return List<List<Integer>> for level order."],
["Find k-th largest element in an array.","QuickSelect: partition-based; average O(n) time. Alternative: min-heap of size k — maintain only k largest; O(n log k). For streaming data: heap approach is preferred."],
["Two Sum — find indices of two numbers that sum to target.","HashMap: for each element, check if complement (target - element) is in map. Store element → index as you iterate. O(n) time, O(n) space."],
["Reverse a linked list.","Iterative: maintain prev, curr, next pointers. Advance: prev=curr, curr=next. O(n) time, O(1) space. Recursive: reverse(head.next), point head.next.next = head, head.next = null."],
["Maximum subarray sum (Kadane's algorithm).","Track currentMax (max ending here) and globalMax. currentMax = max(num, currentMax + num). O(n) time, O(1) space. Extend: also track start and end indices for the subarray."],
["Check if a string is a palindrome.","Two pointers from both ends, compare characters, advance inward. O(n) time, O(1) space. For alphanumeric only: skip non-alphanumeric with Character.isLetterOrDigit() and Character.toLowerCase()."],
["Graph: BFS shortest path.","BFS from source: use queue + visited set. Level = distance. Stop when target is dequeued. O(V+E) time and space."],
["Top K frequent elements.","HashMap for frequencies + min-heap of size k. Final heap contains top-k. O(n log k) time. Alternative: bucket sort (index = frequency) for O(n)."],
["Detect cycle in a directed graph.","DFS with WHITE/GRAY/BLACK colouring. Start DFS from each unvisited node. If you reach a GRAY node, there is a back edge — cycle detected. O(V+E)."],
["Coin change: fewest coins to make amount?","DP: dp[i] = min coins to make amount i. dp[0] = 0. For each amount, try each coin: dp[i] = min(dp[i], dp[i-coin]+1). O(amount × coins) time."],
],
scenarios:[
["Walk through your approach to a LeetCode problem you have not seen.","1) Understand: clarify input/output, edge cases, constraints. 2) Brute force first (O(n²) or higher). 3) Identify bottleneck: repeated computation → DP, nested search → HashMap, sorted → two pointers/binary search. 4) Implement the optimised solution. 5) Test with examples, edge cases (empty, one element, duplicates, negative numbers)."],
["How do you handle edge cases in coding interviews?","Always state them before coding: empty input, single element, duplicates, negative numbers, integer overflow, null pointers. Test your solution mentally with at least 2 examples and an edge case before claiming it is correct."],
],
coding:[
["Two Sum with HashMap.","O(n) time and space.",`public int[] twoSum(int[] nums, int target) {
    Map<Integer, Integer> map = new HashMap<>();
    for (int i = 0; i < nums.length; i++) {
        int complement = target - nums[i];
        if (map.containsKey(complement))
            return new int[]{map.get(complement), i};
        map.put(nums[i], i);
    }
    return new int[]{};
}`],
["Sliding window: longest substring without repeating characters.","O(n) time.",`public int lengthOfLongestSubstring(String s) {
    Map<Character, Integer> last = new HashMap<>();
    int max = 0, left = 0;
    for (int right = 0; right < s.length(); right++) {
        char c = s.charAt(right);
        if (last.containsKey(c))
            left = Math.max(left, last.get(c) + 1);
        last.put(c, right);
        max = Math.max(max, right - left + 1);
    }
    return max;
}`],
["BFS: level-order tree traversal.","Returns list of lists per level.",`public List<List<Integer>> levelOrder(TreeNode root) {
    List<List<Integer>> result = new ArrayList<>();
    if (root == null) return result;
    Queue<TreeNode> q = new LinkedList<>();
    q.offer(root);
    while (!q.isEmpty()) {
        List<Integer> level = new ArrayList<>();
        for (int size = q.size(); size-- > 0;) {
            TreeNode n = q.poll();
            level.add(n.val);
            if (n.left  != null) q.offer(n.left);
            if (n.right != null) q.offer(n.right);
        }
        result.add(level);
    }
    return result;
}`],
["Coin change DP.","Minimum coins to reach target amount.",`public int coinChange(int[] coins, int amount) {
    int[] dp = new int[amount + 1];
    Arrays.fill(dp, amount + 1);
    dp[0] = 0;
    for (int i = 1; i <= amount; i++)
        for (int c : coins)
            if (c <= i) dp[i] = Math.min(dp[i], dp[i - c] + 1);
    return dp[amount] > amount ? -1 : dp[amount];
}`],
]},
{id:"behavioral",phase:"practice",title:"Behavioral Round",tag:"Soft Skills",level:"basic",
summary:"STAR-method answers for leadership, conflict, failure, learning, and common behavioral interview questions.",
concepts:[
["STAR Method","Situation → Task → Action → Result — structure every behavioural answer."],
["Tell Me About Yourself","Brief professional journey (2 min): current role → highlight → why here."],
["Why This Company","Research: product, culture, tech stack, mission — connect to your goals."],
["Strengths & Weaknesses","Strengths: specific with evidence. Weakness: real + steps you are taking to improve."],
["Conflict / Disagreement","Describe calmly; show empathy, data-driven resolution, positive outcome."],
["Leadership / Initiative","Can be non-management: mentoring, driving a project, raising a concern."],
["Failure","Show accountability, learning, and what you would do differently."],
["Ambiguity","Show proactive clarification, breaking down unknowns, iterative approach."],
],
questions:[
["Tell me about yourself.","Two minutes: start with your current role and key expertise, mention a recent highlight (a project outcome or technical achievement), connect to why this role is a natural next step. Practice until fluent — this sets the tone for the entire interview."],
["Describe a time you disagreed with your manager or team.","Use STAR. Focus on: how you raised the concern professionally (data, written doc), how you listened to their perspective, the resolution. Show you can advocate for your view while remaining collaborative. End with what you learned. Interviewers want adults who disagree constructively, not sycophants."],
["Tell me about your biggest professional failure.","Choose a real failure (not a humble-brag). Be specific about what went wrong, your role in it. Show accountability — no finger pointing. Explain the lessons learned and what you changed afterwards. End on the growth. Interviewers want intellectual honesty."],
["Describe a time you delivered a project under tight deadlines.","Show: how you prioritised ruthlessly, communicated scope changes early, coordinated with stakeholders, and what you cut vs what you kept. Include the outcome. Avoid making it sound like you heroically worked nights — show smart planning, not crunch culture."],
["How do you handle ambiguity?","Show: you proactively clarify requirements with stakeholders, break ambiguous problems into smaller knowable pieces, make assumptions explicit and documented, iterate quickly with prototypes, and check alignment early rather than building the wrong thing for weeks."],
["Tell me about a time you improved a process.","Use STAR. Quantify the improvement (cut build time by 40%, reduced error rate from 5% to 0.1%). Show initiative: you identified the problem, proposed the solution, got buy-in, implemented it, measured results. Even small improvements can be powerful examples."],
["How do you stay up to date with Java and backend technology?","Be specific: JEPs (Java Enhancement Proposals), Blogs (Baeldung, InfoQ, foojay.io), podcasts (Inside Java, Java Off-Heap), conference talks (JVM Summit, Devoxx, QCon), contributing to or reading open source projects (Spring, Quarkus). Show genuine curiosity rather than a practised answer."],
["Describe a time you mentored or helped a junior colleague.","Show patience, empathy, and that you helped them grow independently rather than just solving their problems. Explain what you taught and how you measured their progress. Reflects well on team culture and leadership potential."],
["Why do you want to leave your current role?","Be honest but positive: you are seeking greater scope, different technical challenges, alignment with a product you care about. Never badmouth a previous employer — it raises red flags. Connect specifically to what excites you about the new role."],
["Where do you want to be in 5 years?","Show ambition within the scope of the role: deepen technical expertise, grow into a lead/architect, have impact on X type of problem. Align with what the company can offer. Avoid being evasive — interviewers want to understand your motivation and whether the role fits your trajectory."],
["Do you have any questions for us?","Always have 3-5 questions prepared. Good ones: What does success look like in the first 6 months? How do you handle technical debt? What is the biggest challenge the team is facing? What does the on-call rotation look like? What would you change about the team if you could? Avoid: salary (unless invited), vacation policy, or anything on the company website."],
],

],

<script>
// ── STATE ──
const SK='jip:v1';
let S={topicStatus:{},practiced:{},flagged:{},notes:{}};
try{const d=JSON.parse(localStorage.getItem(SK)||'{}');Object.assign(S,d)}catch(e){}
function save(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
function qk(tid,txt){return tid+':'+String(txt).slice(0,55).replace(/\s+/g,'-')}
function ck(tid,term){return'cf:'+tid+':'+String(term).slice(0,30).replace(/\s+/g,'_')}
function isConceptFlag(tid,term){return!!S.flagged[ck(tid,term)]}
function toggleConceptFlag(tid,term,el){
  const k=ck(tid,term);S.flagged[k]=!S.flagged[k];
  el.classList.toggle('act',!!S.flagged[k]);
  el.textContent=S.flagged[k]?'🚩':'⚑';
  const card=el.closest('.concept-card');if(card)card.classList.toggle('c-flagged',!!S.flagged[k]);
  save();updateBadge();
  // Update the flagged count in the filter bar live
  const t=TOPICS.find(t=>t.id===tid);
  if(t){
    const cflagged=t.concepts.filter(([term])=>isConceptFlag(tid,term)).length;
    document.querySelectorAll('.c-filter .q-flt').forEach(btn=>{
      if(btn.textContent.startsWith('🚩'))btn.textContent=`🚩 Flagged${cflagged?` (${cflagged})`:''}`
    });
  }
}
function fltConcepts(el,type){
  el.closest('.c-filter').querySelectorAll('.q-flt').forEach(b=>b.classList.remove('act'));
  el.classList.add('act');
  el.closest('.section').querySelectorAll('.concept-card').forEach(card=>{
    if(type==='all')card.style.display='';
    else card.style.display=card.classList.contains('c-flagged')?'':'none';
  });
}
function getStatus(id){return S.topicStatus[id]||'not_started'}
function computeStatus(tid){
  const t=TOPICS.find(t=>t.id===tid);if(!t)return;
  const all=[...t.questions,...t.scenarios];
  const total=all.length;
  const count=all.filter(q=>isPrac(tid,q[0])).length;
  let st;
  if(count===0)st='not_started';
  else if(count<total)st='studying';
  else st=S.topicStatus[tid]==='review'?'review':'done';
  S.topicStatus[tid]=st;save();
}
function toggleReview(tid){
  const cur=getStatus(tid);
  if(cur==='review')S.topicStatus[tid]='done';
  else S.topicStatus[tid]='review';
  save();renderSb();renderStatusRow(tid);
}
function isPrac(tid,txt){return!!S.practiced[qk(tid,txt)]}
function isFlag(tid,txt){return!!S.flagged[qk(tid,txt)]}
function togglePrac(tid,txt,el){
  const k=qk(tid,txt);S.practiced[k]=!S.practiced[k];
  el.classList.toggle('chk',!!S.practiced[k]);
  const item=el.closest('.q-item');if(item)item.classList.toggle('prac',!!S.practiced[k]);
  computeStatus(tid);updateTpProg(tid);renderSb();renderStatusRow(tid);
}
function toggleFlag(tid,txt,el){
  const k=qk(tid,txt);S.flagged[k]=!S.flagged[k];
  el.classList.toggle('flg',!!S.flagged[k]);
  el.textContent=S.flagged[k]?'🚩':'⚑';
  const item=el.closest('.q-item');if(item)item.classList.toggle('flg',!!S.flagged[k]);
  updateBadge();
}
function saveNotes(tid,v){S.notes[tid]=v;save()}

// ── ROUTER ──
let curTid=null;
function go(route,push=true){
  if(push)history.pushState(null,'','#'+route);
  curTid=null;
  const t=TOPICS.find(t=>t.id===route);
  if(t){curTid=t.id;renderTopic(t);document.title=t.title+' — Java Interview'}
  else{
    if(route==='review')renderReview();
    else if(route==='drill'||route.startsWith('drill?'))renderDrill(route);
    else if(route==='backup')renderBackup();
    else renderHome();
    document.title='Java Interview Roadmap';
  }
  renderSb();
  document.getElementById('page').scrollTop=0;
  closeSb();
}
window.addEventListener('popstate',()=>go(location.hash.slice(1)||'home',false));
document.addEventListener('DOMContentLoaded',()=>{
  renderSb();
  go(location.hash.slice(1)||'home',false);
  applyTheme();
  document.getElementById('sb-q').addEventListener('input',e=>sbSearch(e.target.value));
});

// ── SIDEBAR ──
let collPhases=new Set();
function renderSb(){
  const route=curTid||(location.hash.slice(1)||'home');
  let h='';
  PHASES.forEach(ph=>{
    const pts=TOPICS.filter(t=>t.phase===ph.id);
    const done=pts.filter(t=>getStatus(t.id)==='done').length;
    const col=collPhases.has(ph.id);
    h+=`<div class="ph-group${col?' collapsed':''}">`;
    h+=`<div class="ph-hdr" data-phase="${ph.id}" onclick="togglePh('${ph.id}')">
      <span>${ph.icon}</span><span class="ph-name">${ph.title}</span>
      <span class="ph-done">${done}/${pts.length}</span><span class="ph-arr">▾</span>
    </div><div class="ph-tlist">`;
    pts.forEach(t=>{
      const st=getStatus(t.id);
      const tq=t.questions.length+t.scenarios.length;
      const pq=t.questions.filter(q=>isPrac(t.id,q[0])).length+t.scenarios.filter(q=>isPrac(t.id,q[0])).length;
      h+=`<a class="t-link${route===t.id?' act':''}" href="#${t.id}" onclick="go('${t.id}');return false">
        <span class="sdot sdot-${st}"></span>
        <span class="t-name">${t.title}</span>
        <span class="t-cnt">${pq}/${tq}</span>
      </a>`;
    });
    h+='</div></div>';
  });
  document.getElementById('sb-topics').innerHTML=h;
  updateOvProg();updateBadge();
  // highlight active special
  document.querySelectorAll('.sb-nav a').forEach(a=>{
    const r=a.getAttribute('href').slice(1);
    a.classList.toggle('act',r===route&&!curTid);
  });
}
function togglePh(id){collPhases.has(id)?collPhases.delete(id):collPhases.add(id);renderSb()}
function sbSearch(q){
  q=q.trim().toLowerCase();
  const wrap=document.getElementById('sb-topics');
  if(q.length<2){renderSb();return}
  const hits=TOPICS.filter(t=>t.title.toLowerCase().includes(q)||t.questions.some(qn=>qn[0].toLowerCase().includes(q)));
  if(!hits.length){wrap.innerHTML='<div style="padding:12px;font-size:12px;color:var(--text3)">No results</div>';return}
  wrap.innerHTML=hits.map(t=>`<a class="t-link" href="#${t.id}" onclick="go('${t.id}');return false">
    <span class="sdot sdot-${getStatus(t.id)}"></span><span class="t-name">${t.title}</span></a>`).join('');
}
function updateOvProg(){
  const done=TOPICS.filter(t=>getStatus(t.id)==='done').length;
  const pct=TOPICS.length?Math.round(done/TOPICS.length*100):0;
  document.getElementById('ov-pct').textContent=pct+'%';
  document.getElementById('ov-bar').style.width=pct+'%';
}
function updateBadge(){
  const f=Object.entries(S.flagged).filter(([,v])=>v).length;
  const r=TOPICS.filter(t=>getStatus(t.id)==='review').length;
  const tot=f+r;
  const b=document.getElementById('rev-badge');
  b.textContent=tot;b.style.display=tot>0?'inline-flex':'none';
}
function updateTpProg(tid){
  const t=TOPICS.find(t=>t.id===tid);if(!t)return;
  const tq=t.questions.length+t.scenarios.length;
  const pq=t.questions.filter(q=>isPrac(tid,q[0])).length+t.scenarios.filter(q=>isPrac(tid,q[0])).length;
  const pct=tq?Math.round(pq/tq*100):0;
  const bar=document.getElementById('tp-bar-'+tid);
  if(bar)bar.style.width=pct+'%';
  const lbl=document.getElementById('tp-lbl-'+tid);
  if(lbl)lbl.textContent=pq+'/'+tq+' ('+pct+'%)';
}
function renderStatusRow(tid){
  const row=document.getElementById('sr-'+tid);if(!row)return;
  const st=getStatus(tid);
  row.innerHTML=`<span>Status:</span>
    <span class="st-badge s-${st}">${SL[st]}</span>
    ${(st==='done'||st==='review')?`<button class="st-btn s-review${st==='review'?' act':''}" onclick="toggleReview('${tid}')">${st==='review'?'✓ Review again':'Mark for review'}</button>`:''}`;
}

// ── HOME ──
function renderHome(){
  document.getElementById('tb-title').textContent='Dashboard';
  document.getElementById('tb-actions').innerHTML='';
  const done=TOPICS.filter(t=>getStatus(t.id)==='done').length;
  const studying=TOPICS.filter(t=>getStatus(t.id)==='studying').length;
  const tq=TOPICS.reduce((s,t)=>s+t.questions.length+t.scenarios.length,0);
  const pq=TOPICS.reduce((s,t)=>s+t.questions.filter(q=>isPrac(t.id,q[0])).length+t.scenarios.filter(q=>isPrac(t.id,q[0])).length,0);
  const fg=Object.values(S.flagged).filter(Boolean).length;
  const ovPct=tq?Math.round(pq/tq*100):0;
  let h=`<div class="home-hero">
    <h1 class="home-title" style="font-size:26px;font-weight:800;background:var(--grad-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">☕ Java Interview Roadmap</h1>
    <p class="home-sub">Track your prep across ${TOPICS.length} topics · ${tq}+ questions</p>
    <div style="margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-bottom:6px"><span>Overall progress</span><span style="font-weight:600;color:var(--primary)">${ovPct}%</span></div>
      <div class="prog-bar" style="height:8px;border-radius:4px"><div class="prog-fill" style="width:${ovPct}%;height:100%;border-radius:4px"></div></div>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div style="font-size:22px;margin-bottom:2px">✅</div><div class="stat-num">${done}</div><div class="stat-lbl">Topics Done</div></div>
    <div class="stat-card"><div style="font-size:22px;margin-bottom:2px">📖</div><div class="stat-num">${studying}</div><div class="stat-lbl">Studying</div></div>
    <div class="stat-card"><div style="font-size:22px;margin-bottom:2px">🎯</div><div class="stat-num">${pq}</div><div class="stat-lbl">Practiced</div></div>
    <div class="stat-card"><div style="font-size:22px;margin-bottom:2px">🚩</div><div class="stat-num">${fg}</div><div class="stat-lbl">Flagged</div></div>
  </div>
  <div class="quick-acts">
    <button class="btn btn-primary" onclick="go('drill')">⚡ Quick Drill</button>
    <button class="btn btn-outline" onclick="go('review')">⭐ Review Queue</button>
  </div>
  <h2 class="sec-h2">Progress by Stage</h2>`;
  PHASES.forEach(ph=>{
    const pts=TOPICS.filter(t=>t.phase===ph.id);
    const dn=pts.filter(t=>getStatus(t.id)==='done').length;
    const pct=pts.length?Math.round(dn/pts.length*100):0;
    const phColor={core:'var(--phase-core)',spring:'var(--phase-spring)',databases:'var(--phase-databases)',messaging:'var(--phase-messaging)',practice:'var(--phase-practice)'}[ph.id]||'var(--primary)';
    h+=`<div class="phase-card" style="border-left:4px solid ${phColor}">
      <div class="phase-card-top"><span class="phase-card-title">${ph.icon} ${ph.title}</span>
        <span style="font-size:12px;color:var(--text3)">${dn}/${pts.length} done · ${pct}%</span></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:linear-gradient(135deg,${phColor},${phColor})"></div></div>
      <div class="phase-chips">${pts.map(t=>`<button class="t-chip s-${getStatus(t.id)}" onclick="go('${t.id}')">${t.title}</button>`).join('')}</div>
    </div>`;
  });
  document.getElementById('page').innerHTML=h;
}

// ── TOPIC ──
const SL={not_started:'📝 Not started',studying:'📖 Studying',done:'✅ Done',review:'🔁 Review again'};
function renderTopic(t){
  document.getElementById('tb-title').textContent=t.title;
  document.getElementById('tb-actions').innerHTML=`<button class="btn btn-sm btn-outline" onclick="go('drill?t=${t.id}')">⚡ Drill</button>`;
  const st=getStatus(t.id);
  const tq=t.questions.length+t.scenarios.length;
  const pq=t.questions.filter(q=>isPrac(t.id,q[0])).length+t.scenarios.filter(q=>isPrac(t.id,q[0])).length;
  const pct=tq?Math.round(pq/tq*100):0;
  let h=`<div class="topic-hdr" data-phase="${t.phase}">
    <div class="topic-meta"><span class="t-tag">${esc(t.tag)}</span><span class="lvl-badge">${t.level}</span></div>
    <h1 class="topic-title">${esc(t.title)}</h1>
    <p class="topic-summary">${esc(t.summary)}</p>
    <div class="status-row" id="sr-${t.id}">
      <span>Status:</span>
      <span class="st-badge s-${st}">${SL[st]}</span>
      ${(st==='done'||st==='review')?`<button class="st-btn s-review${st==='review'?' act':''}" onclick="toggleReview('${t.id}')">${st==='review'?'✓ Review again':'Mark for review'}</button>`:''}
    </div>
  </div>
  <div class="tp-prog">
    <div class="tp-prog-lbl"><span>Questions practiced</span><span id="tp-lbl-${t.id}">${pq}/${tq} (${pct}%)</span></div>
    <div class="prog-bar"><div class="prog-fill" id="tp-bar-${t.id}" style="width:${pct}%"></div></div>
  </div>`;
  if(t.concepts&&t.concepts.length){
    const cflagged=t.concepts.filter(([term])=>isConceptFlag(t.id,term)).length;
    h+=`<div class="section"><h2 class="sec-title">📚 Concepts <span class="sec-cnt">${t.concepts.length}</span></h2>
    <div class="c-filter">
      <span class="c-filter-label">Show:</span>
      <button class="q-flt act" onclick="fltConcepts(this,'all')">All</button>
      <button class="q-flt" onclick="fltConcepts(this,'flagged')">🚩 Flagged${cflagged?` (${cflagged})`:''}</button>
    </div>
    <div class="concept-grid">${t.concepts.map(([term,def,points])=>{
      const flagged=isConceptFlag(t.id,term);
      const pointsHtml=Array.isArray(points)&&points.length?`<div class="c-points">${points.map(p=>`<div class="c-point">${esc(p)}</div>`).join('')}</div>`:'';
      const eTerm=escA(term);
      return`<div class="concept-card${flagged?' c-flagged':''}">
        <button class="c-flag${flagged?' act':''}" onclick="event.stopPropagation();toggleConceptFlag('${t.id}','${eTerm}',this)">${flagged?'🚩':'⚑'}</button>
        <div class="c-term">${esc(term)}</div>
        <div class="c-def">${esc(def)}</div>
        ${pointsHtml}
      </div>`;
    }).join('')}</div></div>`;
  }
  if(t.questions&&t.questions.length)h+=renderQSection(t,'questions','❓ Interview Questions');
  if(t.scenarios&&t.scenarios.length)h+=renderQSection(t,'scenarios','🧩 Scenario Questions');
  if(t.coding&&t.coding.length){
    h+=`<div class="section"><h2 class="sec-title">💻 Coding <span class="sec-cnt">${t.coding.length}</span></h2>`;
    t.coding.forEach(([q,ex,code],i)=>{
      h+=`<div class="ci" id="ci-${t.id}-${i}">
        <div class="ci-hdr" onclick="tog('ci-${t.id}-${i}')">
          <span class="ci-num">${i+1}</span><span class="ci-q">${esc(q)}</span><span class="ci-arr">›</span>
        </div>
        <div class="ci-body">
          ${ex?`<div class="ci-explain">${esc(ex)}</div>`:''}
          ${code?`<div class="code-wrap"><button class="copy-btn" onclick="cpCode(this)">Copy</button><div class="code-block">${esc(code)}</div></div>`:''}
        </div>
      </div>`;
    });
    h+='</div>';
  }
  const notes=S.notes[t.id]||'';
  h+=`<div class="section"><h2 class="sec-title">📝 My Notes</h2>
    <textarea class="notes-ta" placeholder="Add your notes here..." onchange="saveNotes('${t.id}',this.value)">${esc(notes)}</textarea>
  </div>`;
  document.getElementById('page').innerHTML=h;
}
function renderQSection(t,type,title){
  const qs=type==='questions'?t.questions:t.scenarios;
  let h=`<div class="section"><h2 class="sec-title">${title} <span class="sec-cnt">${qs.length}</span></h2>
  <div class="q-filter">
    <button class="q-flt act" onclick="fltQ(this,'all')">All</button>
    <button class="q-flt" onclick="fltQ(this,'prac')">Practiced</button>
    <button class="q-flt" onclick="fltQ(this,'unprac')">Not Practiced</button>
    <button class="q-flt" onclick="fltQ(this,'flag')">Flagged</button>
  </div>`;
  qs.forEach((q,i)=>{
    const prac=isPrac(t.id,q[0]),flag=isFlag(t.id,q[0]);
    const qid=`q-${t.id}-${type}-${i}`;
    const ea=escA(q[0]);
    h+=`<div class="q-item${flag?' flg':''}${prac?' prac':''}" id="${qid}">
      <div class="q-hdr" onclick="tog('${qid}')">
        <button class="q-tick${prac?' chk':''}" onclick="event.stopPropagation();togglePrac('${t.id}','${ea}',this)" title="Mark practiced">✓</button>
        <span class="q-text">${esc(q[0])}</span>
        <button class="q-flag${flag?' flg':''}" onclick="event.stopPropagation();toggleFlag('${t.id}','${ea}',this)" title="Flag">${flag?'🚩':'⚑'}</button>
        <span class="q-arr">›</span>
      </div>
      <div class="q-ans">${esc(q[1]).replace(/\n/g,'<br>')}</div>
    </div>`;
  });
  return h+'</div>';
}
function fltQ(btn,f){
  btn.closest('.section').querySelectorAll('.q-flt').forEach(b=>b.classList.toggle('act',b===btn));
  btn.closest('.section').querySelectorAll('.q-item').forEach(el=>{
    if(f==='all')el.style.display='';
    else if(f==='prac')el.style.display=el.classList.contains('prac')?'':'none';
    else if(f==='unprac')el.style.display=!el.classList.contains('prac')?'':'none';
    else if(f==='flag')el.style.display=el.classList.contains('flg')?'':'none';
  });
}
function tog(id){document.getElementById(id).classList.toggle('open')}

// ── REVIEW ──
function renderReview(){
  document.getElementById('tb-title').textContent='Review Queue';
  document.getElementById('tb-actions').innerHTML='';
  const flagged=[];
  TOPICS.forEach(t=>[...t.questions,...t.scenarios].forEach((q)=>{if(isFlag(t.id,q[0]))flagged.push({t,q})}));
  const flaggedConcepts=[];
  TOPICS.forEach(t=>{if(t.concepts)t.concepts.forEach(([term,def,points])=>{if(isConceptFlag(t.id,term))flaggedConcepts.push({t,term,def,points})})});
  const revTopics=TOPICS.filter(t=>getStatus(t.id)==='review');
  if(!flagged.length&&!flaggedConcepts.length&&!revTopics.length){
    document.getElementById('page').innerHTML=`<div class="empty"><div class="empty-ic">⭐</div><div class="empty-txt">Review queue is empty</div><div>Flag questions or concepts, or mark topics as "Review again".</div></div>`;return;
  }
  let h='';
  if(revTopics.length){
    h+=`<h2 class="sec-h2">🔁 Topics for review (${revTopics.length})</h2>`;
    revTopics.forEach(t=>{h+=`<div class="rev-topic-card" onclick="go('${t.id}')"><span class="sdot sdot-review"></span><span style="flex:1">${esc(t.title)}</span><span style="font-size:12px;color:var(--text3)">${t.phase}</span></div>`});
  }
  if(flaggedConcepts.length){
    h+=`<h2 class="sec-h2" style="margin-top:20px">🚩 Flagged Concepts (${flaggedConcepts.length})</h2>`;
    h+=`<div class="concept-grid" style="margin-bottom:16px">`;
    flaggedConcepts.forEach(({t,term,def,points})=>{
      const pointsHtml=Array.isArray(points)&&points.length?`<div class="c-points">${points.map(p=>`<div class="c-point">${esc(p)}</div>`).join('')}</div>`:'';
      h+=`<div class="concept-card c-flagged" onclick="go('${t.id}')" style="cursor:pointer">
        <div style="font-size:10px;color:var(--primary);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">${esc(t.title)}</div>
        <div class="c-term">${esc(term)}</div>
        <div class="c-def">${esc(def)}</div>
        ${pointsHtml}
      </div>`;
    });
    h+='</div>';
  }
  if(flagged.length){
    h+=`<h2 class="sec-h2" style="margin-top:${flaggedConcepts.length?'4':'20'}px">🚩 Flagged Questions (${flagged.length})</h2>`;
    flagged.forEach(({t,q},i)=>{
      const qid='rv-'+i;const prac=isPrac(t.id,q[0]);const ea=escA(q[0]);
      h+=`<div class="q-item flg" id="${qid}">
        <div class="q-hdr" onclick="tog('${qid}')">
          <button class="q-tick${prac?' chk':''}" onclick="event.stopPropagation();togglePrac('${t.id}','${ea}',this)">✓</button>
          <div style="flex:1"><div style="font-size:10px;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">${esc(t.title)}</div>
          <span class="q-text">${esc(q[0])}</span></div>
          <button class="q-flag flg" onclick="event.stopPropagation();toggleFlag('${t.id}','${ea}',this)">🚩</button>
          <span class="q-arr">›</span>
        </div>
        <div class="q-ans">${esc(q[1]).replace(/\n/g,'<br>')}</div>
      </div>`;
    });
  }
  document.getElementById('page').innerHTML=h;
}

// ── DRILL ──
let drillQ=[],drillIdx=0,drillOk=0;
function renderDrill(route='drill'){
  document.getElementById('tb-title').textContent='Quick Drill';
  document.getElementById('tb-actions').innerHTML='';
  const preT=route.includes('?t=')?route.split('?t=')[1]:null;
  let opts='<option value="all">All Topics</option>';
  PHASES.forEach(ph=>{
    opts+=`<optgroup label="${ph.title}">`;
    TOPICS.filter(t=>t.phase===ph.id).forEach(t=>{opts+=`<option value="${t.id}"${preT===t.id?' selected':''}>${t.title}</option>`});
    opts+='</optgroup>';
  });
  document.getElementById('page').innerHTML=`
  <h2 style="font-size:19px;font-weight:700;margin-bottom:8px">⚡ Quick Drill</h2>
  <p style="font-size:13px;color:var(--text2);margin-bottom:18px">Read each question, answer out loud, then reveal and assess.</p>
  <div class="drill-setup">
    <div class="form-group"><label class="form-label">Topics</label><select id="d-topic" class="form-sel">${opts}</select></div>
    <div class="form-group"><label class="form-label">Question pool</label>
      <select id="d-pool" class="form-sel">
        <option value="all">All Questions</option>
        <option value="unprac">Not Practiced</option>
        <option value="flag">Flagged Only</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Max questions</label>
      <select id="d-cnt" class="form-sel"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="all">All</option></select>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:4px" onclick="startDrill()">Start Drill →</button>
  </div>`;
}
function startDrill(){
  const tid=document.getElementById('d-topic').value;
  const pool=document.getElementById('d-pool').value;
  const mx=document.getElementById('d-cnt').value;
  const pts=tid==='all'?TOPICS:TOPICS.filter(t=>t.id===tid);
  drillQ=[];
  pts.forEach(t=>[...t.questions,...t.scenarios].forEach(q=>{
    if(pool==='flag'&&!isFlag(t.id,q[0]))return;
    if(pool==='unprac'&&isPrac(t.id,q[0]))return;
    drillQ.push({t,q});
  }));
  for(let i=drillQ.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[drillQ[i],drillQ[j]]=[drillQ[j],drillQ[i]]}
  if(mx!=='all')drillQ=drillQ.slice(0,parseInt(mx));
  if(!drillQ.length){alert('No questions match your filter.');return}
  drillIdx=0;drillOk=0;showDrillCard();
}
function showDrillCard(){
  if(drillIdx>=drillQ.length){renderDrillDone();return}
  const{t,q}=drillQ[drillIdx];
  const pct=Math.round(drillIdx/drillQ.length*100);
  document.getElementById('page').innerHTML=`
  <div class="drill-prog-wrap">
    <div class="drill-prog-lbl"><span>Question ${drillIdx+1} of ${drillQ.length}</span><span>${pct}%</span></div>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="drill-card">
    <div class="drill-topic-lbl">${esc(t.title)}</div>
    <div class="drill-q">${esc(q[0])}</div>
    <button class="btn btn-outline" id="d-rev" onclick="revealDrill()">Reveal Answer</button>
    <div class="drill-ans" id="d-ans">${esc(q[1]).replace(/\n/g,'<br>')}</div>
    <div class="drill-acts" id="d-acts" style="display:none">
      <button class="btn btn-success" onclick="drillNext(true)">✓ Got it</button>
      <button class="btn btn-warning" onclick="drillNext(false)">↺ Review later</button>
    </div>
  </div>`;
}
function revealDrill(){
  document.getElementById('d-rev').style.display='none';
  document.getElementById('d-ans').classList.add('show');
  document.getElementById('d-acts').style.display='flex';
}
function drillNext(ok){
  const{t,q}=drillQ[drillIdx];
  if(ok){S.practiced[qk(t.id,q[0])]=true;drillOk++}
  else S.flagged[qk(t.id,q[0])]=true;
  save();drillIdx++;showDrillCard();
}
function renderDrillDone(){
  const pct=drillQ.length?Math.round(drillOk/drillQ.length*100):0;
  document.getElementById('page').innerHTML=`<div class="drill-summary">
    <div class="summary-ic">${pct>=70?'🎉':pct>=50?'👍':'📚'}</div>
    <div class="summary-title">Drill Complete!</div>
    <div class="summary-score">${drillOk}/${drillQ.length} correct (${pct}%)</div>
    <div class="summary-acts">
      <button class="btn btn-primary" onclick="startDrill()">Drill Again</button>
      <button class="btn btn-outline" onclick="go('review')">View Flagged</button>
      <button class="btn btn-outline" onclick="go('home')">Dashboard</button>
    </div>
  </div>`;
}

// ── BACKUP ──
function renderBackup(){
  document.getElementById('tb-title').textContent='Backup & Restore';
  document.getElementById('tb-actions').innerHTML='';
  document.getElementById('page').innerHTML=`
  <h2 style="font-size:19px;font-weight:700;margin-bottom:6px">💾 Backup & Restore</h2>
  <p style="font-size:13px;color:var(--text2);margin-bottom:20px">Progress is stored in your browser only. Export regularly.</p>
  <div class="section">
    <h2 class="sec-title">Export</h2>
    <textarea class="backup-ta" readonly onclick="this.select()">${esc(JSON.stringify(S,null,2))}</textarea>
    <button class="btn btn-primary" style="margin-top:8px" onclick="cpBackup()">Copy to Clipboard</button>
  </div>
  <div class="section">
    <h2 class="sec-title">Import</h2>
    <textarea id="imp-ta" class="backup-ta" placeholder="Paste exported JSON here..."></textarea>
    <button class="btn btn-primary" style="margin-top:8px" onclick="doImport()">Import & Merge</button>
  </div>
  <div class="section">
    <h2 class="sec-title" style="color:var(--danger)">Reset</h2>
    <p style="font-size:13px;color:var(--text2);margin-bottom:8px">Clears all progress, practiced marks, and flags.</p>
    <button class="btn btn-danger" onclick="doReset()">Reset All Progress</button>
  </div>`;
}
function cpBackup(){navigator.clipboard.writeText(JSON.stringify(S,null,2)).then(()=>alert('Copied!'))}
function doImport(){
  try{Object.assign(S,JSON.parse(document.getElementById('imp-ta').value));save();alert('Imported!');renderBackup()}
  catch(e){alert('Invalid JSON')}
}
function doReset(){
  if(confirm('Reset ALL progress? This cannot be undone.')){
    S={topicStatus:{},practiced:{},flagged:{},notes:{}};save();renderSb();go('home');
  }
}

// ── UTILS ──
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escA(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function cpCode(btn){
  const txt=btn.nextElementSibling.textContent;
  navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy',1800)});
}
function toggleTheme(){
  const n=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=n;localStorage.setItem('jip:theme',n);
  document.getElementById('theme-btn').textContent=n==='dark'?'☀️ Light':'🌙 Dark';
}
function applyTheme(){
  const th=localStorage.getItem('jip:theme')||'light';
  document.documentElement.dataset.theme=th;
  document.getElementById('theme-btn').textContent=th==='dark'?'☀️ Light':'🌙 Dark';
}
function openSb(){document.getElementById('sb').classList.add('open');document.getElementById('sb-ov').classList.add('show')}
function closeSb(){document.getElementById('sb').classList.remove('open');document.getElementById('sb-ov').classList.remove('show')}
</script>
</body>
</html>
