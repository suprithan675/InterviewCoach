<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Interview Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--border:#e2e8f0;
  --text:#1e293b;--text2:#475569;--text3:#94a3b8;
  --primary:#2563eb;--primary-s:#dbeafe;
  --success:#16a34a;--success-s:#dcfce7;
  --warning:#d97706;--warning-s:#fef9c3;
  --danger:#dc2626;--danger-s:#fee2e2;
  --code-bg:#1e1e2e;--code-text:#cdd6f4;
  --sb-w:280px;--tb-h:56px;--r:10px;--tr:200ms ease;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --shadow-md:0 4px 12px rgba(0,0,0,.12);
  --shadow-hover:0 8px 24px rgba(0,0,0,.13);
  --grad-primary:linear-gradient(135deg,#2563eb 0%,#7c3aed 100%);
  --grad-success:linear-gradient(135deg,#16a34a 0%,#059669 100%);
  --phase-core:#f97316;--phase-core-s:#fff7ed;
  --phase-spring:#16a34a;--phase-spring-s:#f0fdf4;
  --phase-databases:#9333ea;--phase-databases-s:#faf5ff;
  --phase-messaging:#0891b2;--phase-messaging-s:#ecfeff;
  --phase-practice:#db2777;--phase-practice-s:#fdf2f8;
}
[data-theme=dark]{
  --bg:#0f172a;--surface:#1e293b;--surface2:#0f172a;--border:#334155;
  --text:#f1f5f9;--text2:#cbd5e1;--text3:#64748b;
  --primary-s:#1e3a5f;--success-s:#14532d;--warning-s:#451a03;--danger-s:#450a0a;
}
@keyframes bg-flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes fade-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;color:var(--text)}
body{
  display:flex;overflow:hidden;
  background:linear-gradient(135deg,#eef2ff,#fdf4ff,#ecfdf5,#fef9c3,#eef2ff);
  background-size:400% 400%;
  animation:bg-flow 25s ease infinite;
}
[data-theme=dark]{
  background:linear-gradient(135deg,#0f172a,#1e0a2e,#0a1f1a,#1a1500,#0f172a) !important;
  background-size:400% 400% !important;
  animation:bg-flow 25s ease infinite !important;
}

/* ── SIDEBAR ── */
#sb{
  width:var(--sb-w);height:100vh;background:rgba(255,255,255,0.88);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;z-index:200;
  transition:transform var(--tr);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
[data-theme=dark] #sb{background:rgba(30,41,59,0.88)}
.sb-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;
  background:linear-gradient(135deg,var(--surface) 0%,var(--primary-s) 100%);
}
.sb-logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;background:var(--grad-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sb-logo-ic{font-size:20px}
#theme-btn{background:none;border:none;font-size:13px;color:var(--text3);cursor:pointer;white-space:nowrap;padding:2px}
.sb-search{padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-search input{
  width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;
  font-size:13px;background:var(--surface2);color:var(--text);outline:none;
}
.sb-search input:focus{border-color:var(--primary)}
.sb-nav{padding:6px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-nav a{
  display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;
  font-size:13px;color:var(--text2);cursor:pointer;text-decoration:none;transition:all var(--tr);
}
.sb-nav a:hover,.sb-nav a.act{background:var(--primary-s);color:var(--primary)}
.sb-badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  padding:1px 5px;border-radius:10px;min-width:16px;text-align:center;
}
.sb-topics{flex:1;overflow-y:auto;padding:6px 8px}
.ph-group{margin-bottom:2px}
.ph-hdr{
  display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:6px;
  font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--text3);cursor:pointer;user-select:none;transition:all var(--tr);
  border-left:3px solid transparent;padding-left:8px;
}
.ph-hdr:hover{background:var(--surface2);color:var(--text2)}
.ph-hdr[data-phase="core"]{border-left-color:var(--phase-core)}
.ph-hdr[data-phase="spring"]{border-left-color:var(--phase-spring)}
.ph-hdr[data-phase="databases"]{border-left-color:var(--phase-databases)}
.ph-hdr[data-phase="messaging"]{border-left-color:var(--phase-messaging)}
.ph-hdr[data-phase="practice"]{border-left-color:var(--phase-practice)}
.ph-name{flex:1}
.ph-done{font-size:10px;font-weight:400;color:var(--text3)}
.ph-arr{font-size:10px;transition:transform var(--tr)}
.ph-group.collapsed .ph-arr{transform:rotate(-90deg)}
.ph-group.collapsed .ph-tlist{display:none}
.t-link{
  display:flex;align-items:center;gap:7px;padding:5px 7px 5px 18px;border-radius:6px;
  font-size:12.5px;color:var(--text2);cursor:pointer;text-decoration:none;
  transition:all var(--tr);
}
.t-link:hover{background:var(--surface2);color:var(--text)}
.t-link.act{background:var(--primary-s);color:var(--primary);font-weight:600;box-shadow:inset 3px 0 0 var(--primary)}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sdot-not_started{background:var(--text3)}
.sdot-studying{background:var(--primary);animation:pulse-dot 2s ease-in-out infinite}
.sdot-done{background:var(--success)}
.sdot-review{background:var(--warning);animation:pulse-dot 2s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
.t-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-cnt{font-size:11px;color:var(--text3);flex-shrink:0}
.sb-footer{padding:10px 12px;border-top:1px solid var(--border);flex-shrink:0}
.prog-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:4px}
.prog-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--grad-primary);border-radius:2px;transition:width .4s ease}

/* ── OVERLAY ── */
#sb-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:199}
#sb-ov.show{display:block}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{
  height:var(--tb-h);background:rgba(255,255,255,0.8);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
[data-theme=dark] #topbar{background:rgba(30,41,59,0.8)}
.menu-btn{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text);padding:4px}
#tb-title{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tb-actions{display:flex;gap:8px;align-items:center}
#page{flex:1;overflow-y:auto;padding:24px;max-width:900px;margin:0 auto;width:100%}

/* ── HOME ── */
.home-hero{margin-bottom:20px}
.home-title{font-size:26px;font-weight:800;margin-bottom:4px}
.home-sub{font-size:14px;color:var(--text2);margin-top:4px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:rgba(255,255,255,0.75);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center;transition:all var(--tr);cursor:default;backdrop-filter:blur(10px)}
[data-theme=dark] .stat-card{background:rgba(30,41,59,0.75)}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--primary)}
.stat-num{font-size:26px;font-weight:800;background:var(--grad-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:2px;font-weight:500}
.quick-acts{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.phase-card{background:rgba(255,255,255,0.78);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;backdrop-filter:blur(8px)}
[data-theme=dark] .phase-card{background:rgba(30,41,59,0.78)}
.phase-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.phase-card-title{font-weight:600;font-size:14px}
.phase-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.t-chip{
  padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;border:1.5px solid var(--border);
  background:var(--surface2);color:var(--text2);cursor:pointer;transition:all var(--tr);
}
.t-chip:hover{border-color:var(--primary);color:var(--primary)}
.t-chip.s-done{border-color:var(--success);background:var(--success-s);color:var(--success)}
.t-chip.s-studying{border-color:var(--primary);background:var(--primary-s);color:var(--primary)}
.t-chip.s-review{border-color:var(--warning);background:var(--warning-s);color:var(--warning)}

/* ── TOPIC PAGE ── */
#page>*{animation:fade-in .25s ease both}
.topic-hdr{margin-bottom:20px;padding:20px;margin:-24px -24px 20px;border-radius:0;border-bottom:1px solid var(--border)}
.topic-hdr[data-phase="core"]{background:linear-gradient(135deg,rgba(249,115,22,.12),transparent)}
.topic-hdr[data-phase="spring"]{background:linear-gradient(135deg,rgba(22,163,74,.12),transparent)}
.topic-hdr[data-phase="databases"]{background:linear-gradient(135deg,rgba(147,51,234,.12),transparent)}
.topic-hdr[data-phase="messaging"]{background:linear-gradient(135deg,rgba(8,145,178,.12),transparent)}
.topic-hdr[data-phase="practice"]{background:linear-gradient(135deg,rgba(219,39,119,.12),transparent)}
.topic-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.t-tag{
  font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;background:var(--grad-primary);color:#fff;
}
.lvl-badge{font-size:11px;color:var(--text3);font-weight:500}
.topic-title{font-size:22px;font-weight:800;margin-bottom:6px;line-height:1.2}
.topic-summary{font-size:13px;color:var(--text2);margin-bottom:12px;line-height:1.5}
.status-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.status-row span{font-size:12px;color:var(--text3)}
.st-btn{
  padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;
  border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;
  transition:all var(--tr);
}
.st-btn:hover{border-color:var(--primary);color:var(--primary)}
.st-btn.act.s-not_started{background:var(--text3);border-color:var(--text3);color:#fff}
.st-btn.act.s-studying{background:var(--primary);border-color:var(--primary);color:#fff}
.st-btn.act.s-done{background:var(--success);border-color:var(--success);color:#fff}
.st-btn.act.s-review{background:var(--warning);border-color:var(--warning);color:#fff}
.st-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid}
.st-badge.s-not_started{background:var(--surface2);color:var(--text3);border-color:var(--border)}
.st-badge.s-studying{background:var(--primary-s);color:var(--primary);border-color:var(--primary)}
.st-badge.s-done{background:var(--success-s);color:var(--success);border-color:var(--success)}
.st-badge.s-review{background:var(--warning-s);color:var(--warning);border-color:var(--warning)}
.tp-prog{background:rgba(255,255,255,0.78);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:20px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
[data-theme=dark] .tp-prog{background:rgba(30,41,59,0.78)}
.tp-prog-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-bottom:6px;font-weight:500}

/* ── SECTIONS ── */
.section{margin-bottom:28px}
.sec-title{
  font-size:15px;font-weight:600;margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;
}
.sec-cnt{font-size:12px;font-weight:400;color:var(--text3);margin-left:auto}

/* ── CONCEPTS ── */
.concept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.concept-card{position:relative;background:rgba(255,255,255,0.75);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px 10px;transition:all var(--tr);backdrop-filter:blur(8px)}
[data-theme=dark] .concept-card{background:rgba(30,41,59,0.75)}
.concept-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--primary)}
.concept-card:nth-child(5n+1){border-top:3px solid var(--phase-core)}
.concept-card:nth-child(5n+2){border-top:3px solid var(--phase-spring)}
.concept-card:nth-child(5n+3){border-top:3px solid var(--phase-databases)}
.concept-card:nth-child(5n+4){border-top:3px solid var(--phase-messaging)}
.concept-card:nth-child(5n+5){border-top:3px solid var(--phase-practice)}
.concept-card.c-flagged{border-left:3px solid var(--warning) !important}
.c-flag{position:absolute;top:6px;right:6px;background:none;border:none;font-size:12px;cursor:pointer;color:var(--text3);opacity:0;transition:opacity var(--tr);padding:0;line-height:1}
.concept-card:hover .c-flag,.c-flag.act{opacity:1}
.c-flag.act{color:var(--warning)}
.c-points{margin-top:7px;padding-top:7px;border-top:1px dashed var(--border)}
.c-point{font-size:11px;color:var(--text2);display:flex;gap:4px;margin-bottom:3px;line-height:1.3}
.c-point::before{content:'◆';color:var(--primary);font-size:8px;margin-top:2px;flex-shrink:0}
.c-filter{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.c-filter-label{font-size:11px;color:var(--text3);font-weight:500}
.c-term{font-weight:600;font-size:12.5px;margin-bottom:3px}
.c-def{font-size:12px;color:var(--text2);line-height:1.4}

/* ── QUESTIONS ── */
.q-filter{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.q-flt{
  padding:3px 9px;border-radius:4px;font-size:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--text2);cursor:pointer;transition:all var(--tr);
}
.q-flt.act{background:var(--primary);border-color:var(--primary);color:#fff}
.q-item{
  background:rgba(255,255,255,0.78);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:6px;overflow:hidden;transition:border-color var(--tr),box-shadow var(--tr);
  backdrop-filter:blur(8px);
}
[data-theme=dark] .q-item{background:rgba(30,41,59,0.78)}
.q-item.prac{border-left:3px solid var(--success)}
.q-item.flg:not(.prac){border-left:3px solid var(--warning)}
.q-item.prac.flg{border-left:3px solid var(--success)}
.q-hdr{
  display:flex;align-items:flex-start;gap:7px;padding:10px 12px;cursor:pointer;user-select:none;
}
.q-tick{
  flex-shrink:0;width:18px;height:18px;border:2px solid var(--border);border-radius:5px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;
  cursor:pointer;margin-top:1px;transition:all var(--tr);background:none;
}
.q-tick.chk{background:var(--grad-success);border-color:var(--success);color:#fff;transform:scale(1.05)}
.q-text{flex:1;font-size:13px;line-height:1.5;font-weight:500}
.q-flag{
  flex-shrink:0;background:none;border:none;font-size:13px;cursor:pointer;
  color:var(--text3);padding:0;opacity:.5;transition:opacity var(--tr);
}
.q-flag:hover,.q-flag.flg{opacity:1;color:var(--warning)}
.q-arr{flex-shrink:0;color:var(--text3);font-size:12px;transition:transform var(--tr);margin-top:2px}
.q-item.open .q-arr{transform:rotate(90deg)}
.q-ans{
  display:none;padding:0 12px 12px 36px;font-size:13px;line-height:1.6;
  color:var(--text2);border-top:1px solid var(--border);padding-top:10px;
}
.q-item.open .q-ans{display:block}

/* ── CODING ── */
.ci{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.ci-hdr{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;cursor:pointer;user-select:none}
.ci-num{
  flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--grad-primary);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
  box-shadow:0 2px 6px rgba(37,99,235,.35);
}
.ci-q{flex:1;font-size:13px;font-weight:500;line-height:1.4}
.ci-arr{color:var(--text3);font-size:12px;transition:transform var(--tr);flex-shrink:0;margin-top:2px}
.ci.open .ci-arr{transform:rotate(90deg)}
.ci-body{display:none;border-top:1px solid var(--border)}
.ci.open .ci-body{display:block}
.ci-explain{padding:10px 12px;font-size:13px;color:var(--text2)}
.code-wrap{position:relative}
.code-block{
  background:var(--code-bg);color:var(--code-text);font-family:'JetBrains Mono','Fira Code',monospace;
  font-size:12.5px;line-height:1.6;padding:14px 16px;overflow-x:auto;white-space:pre;
}
.copy-btn{
  position:absolute;top:7px;right:8px;background:rgba(255,255,255,.12);border:none;
  color:#cdd6f4;font-size:11px;padding:2px 8px;border-radius:4px;cursor:pointer;
  opacity:0;transition:opacity var(--tr);
}
.code-wrap:hover .copy-btn{opacity:1}

/* ── NOTES ── */
.notes-ta{
  width:100%;min-height:100px;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--r);background:var(--surface);color:var(--text);font-size:13px;
  font-family:inherit;resize:vertical;
}
.notes-ta:focus{outline:none;border-color:var(--primary)}

/* ── DRILL ── */
.drill-setup{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;max-width:460px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.form-sel{
  width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface);color:var(--text);font-size:13px;
}
.drill-prog-wrap{margin-bottom:16px}
.drill-prog-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:4px}
.drill-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.drill-topic-lbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--primary);margin-bottom:10px}
.drill-q{font-size:17px;font-weight:600;line-height:1.4;margin-bottom:16px}
.drill-ans{background:var(--surface2);border-radius:var(--r);padding:12px;font-size:13px;color:var(--text2);margin-bottom:14px;display:none;line-height:1.6}
.drill-ans.show{display:block}
.drill-acts{display:flex;gap:8px;justify-content:center}
.drill-summary{text-align:center;padding:40px 20px}
.summary-ic{font-size:52px;margin-bottom:12px}
.summary-title{font-size:20px;font-weight:700;margin-bottom:6px}
.summary-score{font-size:16px;color:var(--text2);margin-bottom:20px}
.summary-acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ── REVIEW ── */
.rev-topic-card{
  display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:all var(--tr);
}
.rev-topic-card:hover{border-color:var(--primary)}

/* ── BACKUP ── */
.backup-ta{
  width:100%;height:140px;padding:10px;border:1px solid var(--border);border-radius:var(--r);
  background:var(--surface2);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;resize:vertical;
}

/* ── BUTTONS ── */

{id:"java-basics",phase:"core",title:"Java Basics & OOP",tag:"Fundamentals",level:"basic",
summary:"Core OOP principles, class design, inheritance, polymorphism and Java fundamentals.",
concepts:[
["Encapsulation","Bundle data and methods; expose state only via getters/setters.",["Always use private fields","Validate in setters to prevent invalid state","Defensive copies for mutable fields (Date, arrays, List)"]],
["Inheritance","Subclass extends parent, reusing and extending its behaviour with extends.",["Java is single-inheritance only for classes","Call super() first in constructors","Use @Override — compiler catches signature typos"]],
["Polymorphism","One interface, many forms — overloading (compile-time) and overriding (runtime).",["Compile-time poly = overloading (static dispatch)","Runtime poly = overriding (dynamic dispatch)","instanceof check before casting to avoid ClassCastException"]],

["Interface","Contract with method signatures; a class can implement multiple interfaces.",["Java 8+: default and static methods allowed","Java 9+: private methods allowed","Functional interface = exactly one abstract method (use @FunctionalInterface)"]],
["Abstract Class","Cannot be instantiated; may have concrete methods and instance state.",["Use when subclasses share common state or non-public behaviour","Abstract methods must be overridden by concrete subclasses","Constructor can exist — called via super() from subclass"]],
["Method Overloading","Same name, different parameters — resolved at compile time (static dispatch).",["Return type alone does NOT distinguish overloads","Autoboxing and varargs can cause ambiguity","Resolved at compile time — no runtime cost"]],

["final","On class: no subclass. On method: no override. On variable: no reassign.",["final field + reference type: reference fixed, object mutable","Blank final: declared but not initialised — must be set in constructor","Effectively final: compiler treats it as final even without keyword (lambdas require this)"]],
["static","Belongs to the class, not any instance; shared across all objects.",["static methods cannot access instance fields directly","Static initialiser block runs once on class loading","Avoid static mutable state — causes threading and testability issues"]],
["Immutable Class","State cannot change after construction; e.g. String, Integer, LocalDate.",["Declare class final, all fields private final","Return defensive copies from getters for mutable fields","Immutability is naturally thread-safe — no synchronisation needed"]],
["Access Modifiers","private < package-private < protected < public — minimise visibility.",["Default (no keyword) = package-private","Protected accessible to subclasses even in different packages","Prefer private; only open up what is needed (principle of least privilege)"]],

questions:[
["What are the four pillars of OOP?","Encapsulation bundles data and methods, hiding state via access modifiers. Inheritance lets a subclass reuse parent behaviour. Polymorphism provides one interface with many implementations — overloading at compile time, overriding at runtime. Abstraction hides complexity behind a simple interface."],
["Difference between interface and abstract class?","Interface: contract only, multiple implementation allowed, all methods public by default, no instance state. Abstract class: single inheritance, can hold fields and concrete methods. Use interface for unrelated types sharing behaviour; abstract class for a common base with shared state. Java 8+ interfaces can have default and static methods."],
["What is the diamond problem and how does Java handle it?","When a class would inherit the same method from two parents with a common ancestor, it is ambiguous which version to use. Java prevents this by disallowing multiple class inheritance. With Java 8 default methods in interfaces the same conflict can arise, but the compiler forces an explicit override."],
["Difference between method overloading and overriding?","Overloading: same name, different parameter list, resolved at compile time. Overriding: same signature in a subclass, resolved at runtime via dynamic dispatch. Overloading is compile-time (static) polymorphism; overriding is runtime (dynamic) polymorphism."],
["Can we override static methods?","No. Static methods belong to the class, not instances. If a subclass defines a static method with the same signature it hides the parent method (method hiding), not overrides it. The method called depends on the reference type at compile time, not the actual object."],
["Difference between == and equals() for objects?","== compares object references (memory addresses) for objects — true only if both variables point to the same object in memory. equals() compares logical equality. String, Integer, etc. override it for value comparison. Always override equals() (and hashCode()) in custom classes."],
["What is the equals/hashCode contract?","If two objects are equal (equals() returns true) they must have the same hashCode(). Two objects with the same hashCode are not necessarily equal. Violating this breaks HashMap and HashSet, which use hashCode() to find buckets then equals() to confirm equality. Always override both together."],
["How do you create an immutable class?","1) Declare the class final. 2) All fields private final. 3) No setters. 4) Initialise fields in constructor. 5) Store defensive copies of mutable parameters. 6) Return copies from getters of mutable fields. String, Integer, LocalDate are examples."],
["Difference between final, finally, finalize?","final: keyword for constants, non-overridable methods, non-subclassable classes. finally: block in try-catch that always executes — used for cleanup. finalize(): Object method called by the GC before collection — deprecated since Java 9, unreliable, never use it."],
["What are access modifiers in order of visibility?","private: class only. package-private (no keyword): same package. protected: same package plus subclasses. public: everywhere. Best practice: use private by default and open up only as needed."],
["What is autoboxing and what are its pitfalls?","Autoboxing converts a primitive to its wrapper (int→Integer); unboxing is the reverse. Pitfalls: NullPointerException when unboxing a null wrapper; performance overhead in tight loops; == comparison issues — the Integer cache covers −128 to 127 only, so two Integers outside that range are not == even with the same value."],
["What is a marker interface?","An interface with no methods, used to tag a class with metadata. Examples: Serializable (enables Java serialization), Cloneable. Modern Java prefers annotations for the same purpose."],
["Difference between shallow copy and deep copy?","Shallow copy copies the object and reference fields — both share the same nested objects. Deep copy recursively copies all nested objects — the copy is fully independent. Implement via overriding clone(), copy constructors, or serialisation."],
["Can a constructor be private?","Yes. Used in Singleton (only one instance), factory methods, and utility classes (all static methods, like Math). A private constructor can still call another constructor via this()."],
["What is covariant return type?","An overriding method can narrow its return type to a subtype of the parent method's return type. Introduced in Java 5. This avoids casts at the call site. Example: parent returns Animal, override can return Dog."],
["What is the difference between this() and super() in constructors?","this() calls another constructor in the same class (must be the first statement). super() calls the parent constructor (also must be the first statement). You cannot have both in one constructor. The compiler inserts a no-arg super() implicitly if omitted."],
["What is a static initializer block?","A static { } block that runs once when the class is first loaded, before any constructor. Used for complex static field initialisation. Multiple static blocks run in declaration order."],
],
scenarios:[
["Design a payment system: Credit Card, PayPal, Bank Transfer.","Define a PaymentMethod interface with processPayment(amount), validate(), and getDescription(). Each type implements it. If common state (currency, merchant ID) is shared, use an abstract class. Apply the Strategy pattern so PaymentProcessor depends only on PaymentMethod, not the concrete type."],
["A team member made all fields final but nested objects can still mutate. What is wrong?","final prevents reassigning the reference, not mutating the referred object. Fix: store defensive copies in the constructor and return copies from getters for mutable types (List, Date, arrays)."],
["You override equals() but forget hashCode(). What breaks?","Logically-equal objects land in different HashMap buckets. This causes: duplicates in HashSet, inability to retrieve values by equal keys from HashMap, broken Collections.frequency(). Always override both together."],
["A singleton breaks thread safety. How do you fix it?","Use the Bill Pugh Holder pattern: a static inner class initialises the singleton lazily when first accessed — thread-safe by JVM class-loading semantics, no synchronisation overhead. Alternatively, use an enum singleton — the simplest and safest approach."],
["When to prefer composition over inheritance?","Prefer composition for has-a relationships, when behaviour should change at runtime, or when the parent is not designed for extension. Use inheritance only for genuine is-a relationships where the Liskov Substitution Principle holds."],
],

["Implement a thread-safe Singleton using the Bill Pugh Holder pattern.","Static inner class loaded lazily — no synchronisation needed.",`public final class AppConfig {
    private AppConfig() {}

    private static class Holder {
        static final AppConfig INSTANCE = new AppConfig();
    }

    public static AppConfig getInstance() {
        return Holder.INSTANCE;
    }
}`],
["Create an immutable Person class with name and date of birth.","All fields private final; LocalDate is already immutable.",`public final class Person {
    private final String name;
    private final LocalDate dob;

    public Person(String name, LocalDate dob) {
        this.name = Objects.requireNonNull(name);
        this.dob   = Objects.requireNonNull(dob);
    }
    public String getName()    { return name; }
    public LocalDate getDob()  { return dob;  }
}`],

    }

}`],

{id:"strings",phase:"core",title:"Strings",tag:"Core Java",level:"basic",
summary:"String immutability, the string pool, StringBuilder, and common string operations.",
concepts:[
["Immutability","String value cannot change after creation; operations return a new String."],
["String Pool","JVM intern pool of unique string literals; literals reuse pool entries."],
["StringBuilder","Mutable, not thread-safe, fast — use in single-threaded string building."],
["StringBuffer","Mutable, thread-safe (synchronized), slower — use only when needed."],
["intern()","Moves a string to the pool; enables == comparison."],
["CharSequence","Interface implemented by String, StringBuilder, StringBuffer — use in APIs."],
["Text Block","Java 15+ triple-quote string for multi-line content without escapes."],
["String.format()","printf-style formatting: %s, %d, %f, %n; Java 15+ .formatted() instance method."],
["isBlank() / strip()","Java 11: isBlank() checks whitespace only; strip() is Unicode-aware trim()."],
],
questions:[
["Why are Strings immutable in Java?","Security: String values used as class names, passwords, file paths cannot be tampered after creation. Thread safety: immutable objects can be shared freely. String pool efficiency: identical literals can share the same object. hashCode caching: computed once and reused."],
["What is the String pool?","JVM maintains a pool of unique String literals in the heap. When you write String s = \"hello\", the JVM checks the pool first; if \"hello\" exists, s points to it. `new String(\"hello\")` always creates a new object outside the pool. intern() can add a string to the pool."],
["String vs StringBuilder vs StringBuffer — when to use each?","String: immutable, every operation creates a new object. StringBuilder: mutable, not thread-safe, fastest — use in single-threaded string building. StringBuffer: mutable, all methods synchronised — use only when multiple threads modify the same builder (rare)."],
["What is the performance issue with String concatenation in a loop?","str = str + x creates a new String object each iteration because Strings are immutable, causing O(n²) time and heavy GC pressure. Solution: use StringBuilder. The compiler optimises single-line concatenation but not loop-based concatenation."],
["Difference between String.valueOf() and toString()?","toString() throws NullPointerException if called on null. String.valueOf(null) returns the string literal \"null\" safely. Use valueOf() when the input might be null."],
["What Java 11 methods were added to String?","isBlank(): true if empty or only whitespace. strip() / stripLeading() / stripTrailing(): Unicode-aware whitespace removal (unlike trim() which only removes ASCII < 0x20). lines(): splits into Stream<String> by line terminators. repeat(n): repeats the string n times."],
["What is a text block (Java 15+)?","Triple-double-quote strings that preserve formatting for multi-line content without escape sequences. Leading whitespace is stripped based on the indentation of the closing delimiter. Ideal for embedding SQL, JSON, or HTML literals in Java source code."],
["How to compare Strings correctly?","Use equals() for content, equalsIgnoreCase() for case-insensitive. Never use == unless both are known to be pool entries. For nulls: Objects.equals(a, b) or put the literal first: \"expected\".equals(variable) — this avoids NPE."],
["How is String's hashCode computed and why is it cached?","hash = s[0]*31^(n-1) + s[1]*31^(n-2) + ... The hash is stored in a private field (initially 0) and computed only on the first hashCode() call, then reused. This makes String efficient as a HashMap key."],
["What is CharSequence?","An interface implemented by String, StringBuilder, StringBuffer, and CharBuffer. Provides read-only operations: charAt(), length(), subSequence(), toString(). Use CharSequence in API method signatures to accept any string-like type without committing to String."],
["How does split() handle trailing empty strings?","Trailing empty strings are discarded by default. Pass -1 as the limit argument to retain them: split(\",\", -1). For example, \"a,b,,\".split(\",\") returns [\"a\",\"b\"] but split(\",\",-1) returns [\"a\",\"b\",\"\",\"\"]."],
["Difference between matches() and contains()?","contains(CharSequence) tests for a literal substring anywhere in the string. matches(String) tests if the ENTIRE string matches the given regex — equivalent to `s.matches(\"ell\")` being false for \"hello\" because it must match the whole string."],
["What is String.join()?","Static factory: String.join(\", \", \"a\", \"b\", \"c\") returns \"a, b, c\". Accepts a vararg or Iterable. Uses StringJoiner internally. For Stream<String>, use Collectors.joining(delimiter, prefix, suffix)."],
["How to convert String to primitive types?","Integer.parseInt(s), Double.parseDouble(s), Long.parseLong(s), Boolean.parseBoolean(s). These throw NumberFormatException for invalid input. Integer.valueOf(s) returns a boxed Integer (may use Integer cache for small values)."],
["What is intern()?","Checks if an equal string exists in the pool; if so, returns the pool reference; otherwise adds the string to the pool and returns its reference. After interning, == comparison is valid. Rarely needed in modern code — useful only for performance-critical scenarios with many repeated strings."],
],
scenarios:[
["You have a performance issue building a large report string in a loop. How do you fix it?","Replace String + concatenation in the loop with StringBuilder.append() and call toString() once at the end. For streaming output, write directly to a Writer instead of building in memory. This converts O(n²) string building to O(n)."],
["How would you check if two strings are anagrams?","Sort both strings as char arrays and compare, or count character frequencies with a HashMap/int[26] array. The int[26] approach (for lowercase letters) is O(n) time and O(1) space."],
["You need to parse CSV lines that may contain quoted fields with commas inside. How?","Use a proper CSV parser library (OpenCSV, Apache Commons CSV) rather than split(). These handle quoted fields, escaped delimiters, and newlines inside quoted values correctly. Regex or split() alone cannot reliably handle these edge cases."],
],
coding:[
["Reverse words in a sentence.","Split, reverse array, rejoin — or use a StringBuilder approach.",`public String reverseWords(String s) {
    String[] words = s.trim().split("\\\\s+");
    StringBuilder sb = new StringBuilder();
    for (int i = words.length - 1; i >= 0; i--) {
        sb.append(words[i]);
        if (i > 0) sb.append(' ');
    }
    return sb.toString();
}`],
["Find the first non-repeated character in a string.","Use a LinkedHashMap to preserve insertion order while counting.",`public char firstUnique(String s) {
    Map<Character, Integer> freq = new LinkedHashMap<>();
    for (char c : s.toCharArray())
        freq.merge(c, 1, Integer::sum);
    for (var e : freq.entrySet())
        if (e.getValue() == 1) return e.getKey();
    return '\\0';
}`],
["Check if two strings are anagrams.","Sort both char arrays and compare.",`public boolean isAnagram(String a, String b) {
    if (a.length() != b.length()) return false;
    char[] ca = a.toCharArray(), cb = b.toCharArray();
    Arrays.sort(ca);
    Arrays.sort(cb);
    return Arrays.equals(ca, cb);
}`],
]},
{id:"collections",phase:"core",title:"Collections Framework",tag:"Data Structures",level:"intermediate",
summary:"List, Map, Set, Queue implementations, internal workings, thread-safety, and choosing the right collection.",
concepts:[
["List","Ordered, allows duplicates. ArrayList (array-backed, fast random access), LinkedList (doubly linked)."],
["Set","No duplicates. HashSet (O(1)), LinkedHashSet (insertion order), TreeSet (sorted, O(log n))."],
["Map","Key-value pairs. HashMap (O(1)), LinkedHashMap (order), TreeMap (sorted), ConcurrentHashMap."],
["Queue/Deque","FIFO queue. PriorityQueue (heap). ArrayDeque preferred over LinkedList for queue/stack."],
["HashMap Internals","Array of buckets; bucket determined by hashCode(); Java 8 converts chains >8 to balanced trees."],
["ConcurrentHashMap","Thread-safe Map using per-bucket locking (CAS); reads never block; much faster than synchronizedMap."],
["Fail-fast Iterator","Throws ConcurrentModificationException if collection structurally changed during iteration."],
["Comparable","Defines natural ordering via compareTo(); implemented in the class itself."],
["Comparator","External ordering strategy; passed to sort/TreeSet; enables multiple orderings."],
["Collections Utility","Collections.sort(), shuffle(), unmodifiableList(), synchronizedList(), frequency(), min(), max()."],
],
questions:[
["Difference between ArrayList and LinkedList?","ArrayList: contiguous array, O(1) random access, O(n) insert/delete in middle. LinkedList: doubly linked, O(1) insert/delete at known position, O(n) random access. Prefer ArrayList in almost all cases; use LinkedList/ArrayDeque only when you need a Deque."],
["How does HashMap work internally?","Stores entries in an array of buckets. hashCode() of the key determines the bucket; equals() resolves collisions within the bucket. Java 8+: when a bucket's chain exceeds 8 entries it's converted to a balanced tree (O(log n) lookup instead of O(n))."],
["What is HashMap's initial capacity and load factor?","Default initial capacity: 16. Default load factor: 0.75. When size exceeds capacity × load factor the map rehashes, doubling capacity. Pre-size for large maps: `new HashMap<>(expectedSize * 4 / 3 + 1)` to avoid rehashing."],
["HashMap vs LinkedHashMap vs TreeMap?","HashMap: unordered, O(1) get/put. LinkedHashMap: maintains insertion (or access) order, O(1). TreeMap: sorted by key (natural order or Comparator), O(log n) for all operations. Use LinkedHashMap for ordered output; TreeMap for range queries or sorted key iteration."],
["HashSet vs LinkedHashSet vs TreeSet?","HashSet: unordered, O(1). LinkedHashSet: insertion order, O(1). TreeSet: sorted, O(log n). All are backed by the corresponding Map. TreeSet requires elements to be Comparable or a Comparator to be provided."],
["What is ConcurrentHashMap and how does it achieve thread safety?","In Java 8+ it uses a lock-free reads approach and locks only individual buckets on write (CAS + synchronized on the bucket head). Reads never block. Throughput scales with the number of segments. Much faster than Collections.synchronizedMap() which locks the entire map on every operation."],
["What is a fail-fast iterator?","Throws ConcurrentModificationException when a collection is structurally modified while being iterated (tracked via a modCount). ArrayList, HashMap iterators are fail-fast. For safe iteration under modification, use CopyOnWriteArrayList, ConcurrentHashMap, or collect modifications and apply after iteration."],
["Comparable vs Comparator?","Comparable: implemented in the class (compareTo()); defines the natural ordering. Comparator: external strategy passed to sort, TreeSet, etc.; enables multiple orderings for the same class. Use Comparable for the natural order; Comparator for alternative orderings or classes you don't own."],
["How to sort a list of custom objects?","list.sort(Comparator.comparing(Person::getName)) or Collections.sort(list, comparator). Chain with .thenComparing() for multi-field sort. For primitive arrays use Arrays.sort(). For natural order, the class must implement Comparable."],
["remove() vs poll() in Queue?","remove() throws NoSuchElementException if the queue is empty. poll() returns null instead. Use poll() when an empty queue is a normal condition. Corresponding pair for peeking: element() (throws) vs peek() (null)."],
["What is PriorityQueue?","A min-heap by default — the smallest element is polled first. Pass Comparator.reverseOrder() for a max-heap. O(log n) offer/poll, O(1) peek, O(n) contains. Not sorted — only the head is guaranteed to be the minimum."],
["What is ArrayDeque vs LinkedList for queue use?","ArrayDeque is backed by a resizable circular array — faster than LinkedList for queue/stack operations (no node allocation overhead, better cache locality). Prefer ArrayDeque. Use LinkedList only if you need ListIterator or null elements."],
["How to implement an LRU cache using LinkedHashMap?","Extend LinkedHashMap(capacity, 0.75f, true) with accessOrder=true and override removeEldestEntry() to return true when size() > maxCapacity. The access-order mode moves accessed entries to the tail, so removeEldestEntry removes the least recently used head."],
["What is CopyOnWriteArrayList?","Thread-safe List that creates a new copy of the internal array on every write. Reads never block and are always consistent. Ideal for read-heavy, infrequently-modified lists (e.g., event listeners). Do not use for write-heavy scenarios — copying is expensive."],
["Collections.unmodifiableList() vs List.of()?","unmodifiableList: a view — read-only wrapper around the original; the original can still be mutated through its reference. List.of() (Java 9+): creates a truly immutable list from scratch; throws UnsupportedOperationException on add/set/remove. List.copyOf() creates an immutable defensive copy."],
["What is WeakHashMap?","A Map where keys are held by weak references and can be garbage-collected when no strong reference to the key exists. Useful for memory-sensitive caches where entries should expire when the key is no longer in use. Contrast with SoftHashMap (held until memory pressure)."],
["How to make a thread-safe list?","1) Collections.synchronizedList(new ArrayList<>()) — locks the whole list on every operation. 2) CopyOnWriteArrayList — lock-free reads, copies on write. 3) Vector — legacy, synchronised methods. Use CopyOnWriteArrayList for read-heavy scenarios; ConcurrentLinkedQueue for concurrent queue operations."],
["What is EnumSet and EnumMap?","EnumSet: Set implementation for enum values, backed by a bit vector — O(1) all operations, extremely memory-efficient. EnumMap: array-backed Map for enum keys — faster than HashMap for enum keys. Always prefer these over general collections when working with enums."],
],
scenarios:[
["You need insertion-order Map with fast lookup. Which collection?","LinkedHashMap: O(1) get/put (like HashMap) while also maintaining insertion order of entries. Use accessOrder=true for LRU behaviour."],
["Implement an LRU cache.","Extend LinkedHashMap(maxSize, 0.75f, true) and override removeEldestEntry() to return size() > maxSize. This gives O(1) get and put with automatic eviction of the least recently used entry."],
["You need to find duplicates in a List<String> efficiently.","Use a HashSet: iterate the list, add each element. If add() returns false the element is a duplicate — O(n) time and O(n) space. Alternative: Collectors.groupingBy(identity, counting()) to get frequency counts."],
["Your HashMap lookups are O(n) despite having few entries. What is wrong?","The key class has a broken hashCode() that always returns the same value (e.g., returns 0). All entries land in the same bucket, degrading HashMap to a linked list. Fix: implement a proper hashCode() that distributes keys uniformly across buckets."],
["You need a sorted set that also allows navigating to neighbours (floor, ceiling, higher, lower) of an element.","Use TreeSet, which implements NavigableSet. Methods: floor(e) ≤ e, ceiling(e) ≥ e, lower(e) < e, higher(e) > e, headSet, tailSet, subSet for range views."],
],
coding:[
["Count frequency of each word in a list.","groupingBy with counting collector.",`Map<String, Long> freq = words.stream()
    .collect(Collectors.groupingBy(
        Function.identity(), Collectors.counting()));`],
["Find intersection of two lists (without duplicates).","Retain elements present in both using Set.",`public <T> List<T> intersect(List<T> a, List<T> b) {
    Set<T> setB = new HashSet<>(b);
    return a.stream()
            .filter(setB::contains)
            .distinct()
            .collect(Collectors.toList());
}`],
["Group a list of strings by their first character.","groupingBy with key extractor.",`Map<Character, List<String>> grouped = words.stream()
    .collect(Collectors.groupingBy(s -> s.charAt(0)));`],
]},
{id:"exceptions-generics",phase:"core",title:"Exceptions & Generics",tag:"Core Java",level:"intermediate",
summary:"Checked vs unchecked exceptions, exception hierarchy, try-with-resources, and generic type safety.",
concepts:[
["Checked Exception","Must be declared with throws or caught; extends Exception but not RuntimeException."],
["Unchecked Exception","Extends RuntimeException; not enforced by the compiler."],
["Error","Extends Throwable; JVM-level issues (OutOfMemoryError); normally do not catch."],
["try-with-resources","Auto-closes AutoCloseable; preferred over manual finally for resource management."],
["Multi-catch","catch (IOException | SQLException e) — handle multiple exception types in one block."],
["Exception Chaining","Wrap the original cause: new ServiceException(\"msg\", cause) — preserves stack trace."],
["Generics","Compile-time type parameters eliminate casts and add type safety to collections/APIs."],
["Type Erasure","Generic type parameters are removed at compile time and replaced with Object/bound type."],
["Wildcard","? unknown type. <? extends T> upper bound (read-safe). <? super T> lower bound (write-safe)."],
["PECS","Producer Extends, Consumer Super — mnemonic for wildcard choice."],
],
questions:[
["What is the exception hierarchy?","Throwable → Error (JVM issues, usually uncatchable) and Exception → RuntimeException (unchecked) and other Exception subclasses (checked). Best practice: throw the most specific exception; catch the most general you can handle."],
["Checked vs unchecked exceptions — when to use each?","Checked: recoverable conditions the caller should explicitly handle (IOException, SQLException). Unchecked: programming errors or unrecoverable conditions (NullPointerException, IllegalArgumentException). Modern practice: prefer unchecked — checked exceptions create tight coupling and are often swallowed."],
["throw vs throws?","throw: statement that throws an exception object (throw new IOException()). throws: declaration in a method signature listing checked exceptions callers must handle (void read() throws IOException). They are orthogonal: throw triggers, throws declares."],
["When does finally NOT execute?","System.exit() calls, JVM crash, or if the thread is killed externally. In all other cases — including return, break inside try/catch — finally always runs."],
["What is try-with-resources?","Automatically calls close() on AutoCloseable resources when the try block exits, even if an exception occurs. Preferred over manual finally for resource cleanup. Multiple resources are closed in reverse declaration order. Suppressed exceptions from close() are attached to the primary exception."],
["What is multi-catch (Java 7+)?","catch (IOException | SQLException e) catches multiple types in one block. The variable is implicitly final. Avoids duplicating handler code for unrelated exceptions that should be handled the same way."],
["What is exception chaining?","Preserving the original cause when rethrowing: throw new ServiceException(\"Failed\", cause). Callers can access it via getCause(). This preserves the full stack trace for debugging. Never swallow exceptions with an empty catch block."],
["What are generics and why use them?","Generics add compile-time type parameters to classes and methods, eliminating casts and catching type errors early. Without generics you use Object and cast explicitly — runtime ClassCastException is possible. With generics, the compiler enforces types."],
["What is type erasure?","Generic type parameters are removed at compile time and replaced with Object (or the first bound type). At runtime List<String> and List<Integer> are both just List. This is why new T(), new T[], and instanceof List<String> are compile errors."],
["Difference between List<Object> and List<?>?","List<Object> can hold any Object but cannot be assigned a List<String> (not a subtype due to invariance). List<?> (unbounded wildcard) accepts any typed list but you can only add null to it — you can safely get() values as Object."],
["<? extends T> vs <? super T>?","<? extends T> (upper bound): the list is a producer — you can get T values, cannot add (except null). <? super T> (lower bound): the list is a consumer — you can add T values, get() returns Object. Mnemonic: PECS (Producer Extends, Consumer Super)."],
["What is a bounded type parameter?","<T extends Comparable<T>> constrains T to types that implement Comparable<T>. This allows calling compareTo() inside the method. Multiple bounds: <T extends Serializable & Comparable<T>>."],
["Can you create a generic array?","No: new T[] is a compile error due to type erasure. Workarounds: unchecked cast `(T[]) new Object[n]`, or use List<T>. The reflection-based approach uses Array.newInstance(Class<T>, size) but requires passing the class token."],
["StackOverflowError vs OutOfMemoryError?","StackOverflowError: recursive calls exceed the thread's stack limit. OutOfMemoryError: JVM heap exhausted (memory leak, excessive allocation). Both extend Error — normally do not catch them, as the JVM state may be corrupt."],
["What is a custom exception and when to create one?","Create a custom exception when: the error needs a specific name for catch blocks to target it, additional context fields are needed (error code, offending value), or you want to group related exceptions under a common type. Extend RuntimeException for unchecked or Exception for checked."],
],
scenarios:[
["You have deeply nested code and need to propagate an exception from a database layer to the API layer without coupling the API to JDBC.","Catch SQLException at the DAO layer and rethrow as a custom unchecked DataAccessException, preserving the original cause: throw new DataAccessException(\"query failed\", e). The service and API layers catch DataAccessException, decoupled from JDBC."],
["A developer swallowed an exception with an empty catch block and now errors are silently ignored.","At minimum, log the exception at ERROR level in the catch block. Better: rethrow as an unchecked exception. Never swallow exceptions unless you explicitly know the failure is non-fatal and you document why."],
["You need a method that works for both List<Integer> and List<Double>.","Use a wildcard: void printSum(List<? extends Number> list). The upper bound <? extends Number> allows passing any list of a Number subtype. Inside the method, get() returns Number, allowing sum() or doubleValue() calls."],
],
coding:[
["Custom unchecked exception with error code.","Extends RuntimeException with an additional field.",`public class AppException extends RuntimeException {
    private final String code;
    public AppException(String code, String msg) {
        super(msg);
        this.code = code;
    }
    public AppException(String code, String msg, Throwable cause) {
        super(msg, cause);
        this.code = code;
    }
    public String getCode() { return code; }
}`],
["Generic Pair class.","Type parameters eliminate casts.",`public class Pair<A, B> {
    private final A first;
    private final B second;
    public Pair(A first, B second) {
        this.first = first; this.second = second;
    }
    public A getFirst()  { return first; }
    public B getSecond() { return second; }
    public static <A,B> Pair<A,B> of(A a, B b) { return new Pair<>(a, b); }
}`],
["Generic method: find max using bounded type parameter.","T must implement Comparable.",`public <T extends Comparable<T>> T max(List<T> list) {
    if (list.isEmpty()) throw new NoSuchElementException();
    T result = list.get(0);
    for (T item : list)
        if (item.compareTo(result) > 0) result = item;
    return result;
}`],
]},
{id:"java8",phase:"core",title:"Java 8 Features",tag:"Modern Java",level:"intermediate",
summary:"Lambda expressions, functional interfaces, Optional, new Date/Time API, and default methods.",
concepts:[
["Lambda Expression","Anonymous function (params) -> body; implements a functional interface."],
["Functional Interface","Interface with exactly one abstract method; @FunctionalInterface annotation."],
["Method Reference","Shorthand for a lambda calling an existing method: Class::method."],
["Optional<T>","Container for a value that may be absent; forces explicit null handling."],
["Default Method","Concrete method in an interface (keyword default); no breaking change for existing impls."],
["Stream API","Lazy, declarative pipeline processing of sequences."],
["java.time","Immutable date/time API: LocalDate, LocalDateTime, ZonedDateTime, Instant, Duration, Period."],
["CompletableFuture","Composable async computation with callbacks (thenApply, thenCompose, exceptionally)."],
["Predicate<T>","T → boolean; composable with and(), or(), negate()."],
["Function<T,R>","T → R; compose() and andThen() for chaining."],
],
questions:[
["What are the main Java 8 features?","Lambda expressions, Stream API, Optional, default and static interface methods, new Date/Time API (java.time package), CompletableFuture, method references, improved type inference for generics."],
["What is a functional interface?","An interface with exactly one abstract method. Annotated @FunctionalInterface (optional but recommended). Can have default and static methods. Examples: Runnable, Comparator, Predicate<T>, Function<T,R>, Consumer<T>, Supplier<T>."],
["What is a lambda expression?","Anonymous function: (params) -> body. Implements a functional interface. Captures (closures over) effectively-final local variables from the enclosing scope. this inside a lambda refers to the enclosing class, not the lambda."],
["Lambda vs anonymous class?","Lambda: concise, no extra .class file, this refers to the enclosing class, cannot be used for interfaces with multiple abstract methods. Anonymous class: can have state, can implement multiple methods, this refers to the anonymous class."],
["Types of method references?","1) Static: Integer::parseInt. 2) Instance method on a particular object: logger::log. 3) Instance method on an arbitrary object of a type: String::toUpperCase (called on each element). 4) Constructor: ArrayList::new."],
["What is Optional and when to use it?","Container that may or may not hold a value, forcing callers to handle the absent case. Create with Optional.of(val), Optional.ofNullable(val), Optional.empty(). Use for return types when absence is a valid, expected outcome. Never use Optional as a parameter type or in fields."],
["What are default interface methods?","Concrete methods marked default in an interface, allowing new methods to be added without breaking existing implementations. If two interfaces provide the same default method, the class must override it to resolve the conflict."],
["Difference between LocalDate, LocalDateTime, ZonedDateTime?","LocalDate: date only (year/month/day), no time, no timezone. LocalDateTime: date and time, no timezone. ZonedDateTime: date, time, and explicit timezone. All are immutable and thread-safe. Use ZonedDateTime for scheduling; LocalDate for birthdays or anniversaries."],
["What is CompletableFuture?","A Future that supports non-blocking composition. thenApply() transforms the result. thenCompose() chains dependent futures. thenCombine() merges two independent futures. exceptionally() / handle() for error recovery. Runs on ForkJoinPool.commonPool() by default; pass a custom Executor for I/O tasks."],
["Predicate, Function, Consumer, Supplier?","Predicate<T>: T→boolean (and, or, negate). Function<T,R>: T→R (andThen, compose). Consumer<T>: T→void (andThen). Supplier<T>: ()→T. BiFunction, UnaryOperator, BinaryOperator are related. BiFunction<T,U,R> takes two inputs."],
["What is Comparator.comparing()?","Static factory for type-safe comparators: Comparator.comparing(Person::getAge).thenComparing(Person::getName). Avoids manual comparison logic and casting. reversed() flips order. nullsFirst/nullsLast handle null elements."],
["map() vs flatMap() in Optional?","map() wraps the mapper's result in a new Optional — use when the mapper returns a plain value. flatMap() expects the mapper to return an Optional itself, preventing Optional<Optional<T>> nesting. Use flatMap() to chain Optional-returning methods."],
["How to handle checked exceptions inside a lambda?","Checked exceptions cannot be thrown from standard functional interfaces that don't declare them. Options: 1) Wrap in a RuntimeException inside a utility method. 2) Use a custom functional interface that declares throws. 3) Handle the exception inside the lambda body with try-catch."],
["What is Collectors.joining()?","Terminal collector for Stream<String>: joining() concatenates, joining(delim) adds delimiter, joining(delim, prefix, suffix) wraps. Useful for CSV strings: stream.collect(Collectors.joining(\", \", \"[\", \"]\"))."],
["What are static interface methods (Java 8)?","Methods declared static in an interface. Called as Interface.method() — not inherited by implementing classes. Used for factory methods (List.of, Map.of) and utility helpers associated with the interface."],
],
scenarios:[
["Replace a chain of null checks with Optional.","Wrap the first nullable result in Optional.ofNullable() and chain map() / flatMap() calls: Optional.ofNullable(user).map(User::getAddress).map(Address::getCity).orElse(\"Unknown\")."],
["You have a list of employees and need: total salary by department.","employees.stream().collect(Collectors.groupingBy(Employee::getDept, Collectors.summingDouble(Employee::getSalary)))"],
["Compose two Predicates: nameStartsWithA AND salaryOver50k.","Predicate<Employee> p1 = e -> e.getName().startsWith(\"A\"); Predicate<Employee> p2 = e -> e.getSalary() > 50000; employees.stream().filter(p1.and(p2)).collect(Collectors.toList())."],
],
coding:[
["Sort a list of Person by age descending, then by name ascending.","Method references and thenComparing chain.",`list.sort(Comparator.comparingInt(Person::getAge)
    .reversed()
    .thenComparing(Person::getName));`],
["Chain CompletableFuture: fetch user, then fetch orders for that user.","thenCompose avoids nested futures.",`CompletableFuture<List<Order>> orders =
    fetchUser(userId)
        .thenCompose(user -> fetchOrders(user.getId()))
        .exceptionally(ex -> { log.error("Failed", ex); return List.of(); });`],
["Parse a CSV string into a list of integers, skipping blanks.","Filter and map with stream pipeline.",`List<Integer> nums = Arrays.stream(csv.split(","))
    .map(String::trim)
    .filter(s -> !s.isBlank())
    .map(Integer::parseInt)
    .collect(Collectors.toList());`],
]},
{id:"streams",phase:"core",title:"Streams API",tag:"Functional Java",level:"intermediate",
summary:"Lazy stream pipelines, intermediate and terminal operations, collectors, parallel streams, and common patterns.",
concepts:[
["Intermediate Operation","Lazy; returns a Stream. Examples: filter, map, flatMap, sorted, distinct, peek, limit, skip."],
["Terminal Operation","Eager; triggers the pipeline. Examples: collect, reduce, forEach, count, findFirst, anyMatch."],
["Lazy Evaluation","Pipeline executes only when terminal is called; stops early if possible (findFirst + filter)."],
["Collector","Strategy for assembling stream results; Collectors class provides built-in factories."],
["groupingBy","Groups elements by a classifier into Map<K, List<V>>; supports downstream collectors."],
["reduce","Folds elements into a single value with an associative accumulator."],
["Parallel Stream","Uses ForkJoinPool; useful for CPU-bound, independent, stateless operations on large data."],
["Spliterator","Iterator + splitting logic for parallel stream processing; hints (SORTED, SIZED) aid optimisation."],
["IntStream / LongStream","Primitive specialisations; avoid boxing; range(), rangeClosed(), sum(), average()."],
],
questions:[
["What is a Stream and how does it differ from a Collection?","Stream: pipeline of lazy operations on a sequence of elements; processes elements on demand, does not store data, cannot be reused. Collection: in-memory data structure that stores and owns elements, can be iterated multiple times."],
["What is lazy evaluation in streams?","Intermediate operations (filter, map) are not executed until a terminal operation is called. The stream only processes elements as needed — a filter+findFirst stops at the first match, not after processing all elements."],
["Can a Stream be reused?","No. Once a terminal operation is called, the stream is consumed. Calling a second terminal on the same stream instance throws IllegalStateException. Create a new stream from the source for each pipeline."],
["map() vs flatMap()?","map() transforms each element to exactly one new element: Stream<List<String>> stays nested. flatMap() transforms each element to zero or more elements and flattens one level: Stream<Stream<String>> → Stream<String>. Use flatMap() to unnest nested collections."],
["What is reduce()?","Combines elements into a single result: stream.reduce(identity, accumulator) or stream.reduce(BinaryOperator). `stream.reduce(0, Integer::sum)` sums integers. The variant without identity returns Optional<T>. For more complex accumulation, use collect() with a Collector."],
["What is collect() and what is a Collector?","collect() is a mutable reduction terminal operation. Collectors provide strategies: toList(), toSet(), toMap(), groupingBy(), joining(), counting(), summingInt(), partitioningBy(). Custom Collectors can be built with Collector.of()."],
["What is Collectors.groupingBy()?","Groups stream elements by a classifier function: stream.collect(groupingBy(Person::getDept)). Result is Map<K, List<V>>. Downstream collectors enable counting, averaging, mapping, or joining within each group: groupingBy(dept, counting())."],
["findFirst() vs findAny()?","findFirst() returns the first element in encounter order (deterministic). findAny() may return any element — no ordering guarantee, but may be more efficient in parallel streams where short-circuiting is easier without enforcing order."],
["Parallel stream pitfalls?","Do not use for: small datasets (parallelisation overhead exceeds gain), IO-bound tasks, operations with side effects (shared mutable state), operations requiring encounter order. Always benchmark. Use ForkJoinPool.commonPool() by default; for custom pools wrap in pool.submit(() -> stream.parallel()…).get()."],
["What is a Spliterator?","Iterator that also supports splitting for parallel processing. Characteristics like SORTED, DISTINCT, SIZED, SUBSIZED hint to the stream framework for optimisations. Custom Spliterators enable streaming over non-standard sources (tree structures, sensor feeds)."],
["Stream.iterate() vs Stream.generate()?","iterate(seed, UnaryOperator): sequential stream seed, f(seed), f(f(seed)), … — deterministic, good for numeric sequences. Java 9+ adds a predicate form for a finite stream. generate(Supplier): infinite stream of supplied values — useful for random numbers or repeated values. Both require limit() or takeWhile() to terminate."],
["What is peek()?","An intermediate operation for debugging: applies a Consumer to each element as it flows through without modifying the stream. Use for logging: .peek(e -> log.debug(\"elem: {}\", e)). Not intended for mutation of elements — behaviour differs between sequential and parallel streams."],
["IntStream, LongStream, DoubleStream?","Primitive specialisations of Stream to avoid boxing overhead. IntStream.range(0, 10) produces [0..9] (exclusive end), rangeClosed(0,10) includes 10. sum(), average(), min(), max() are available directly. Obtain via mapToInt(), mapToLong(), mapToDouble(); back to Stream<Integer> via boxed() or mapToObj()."],
["How to convert a stream to a Map with duplicate key handling?","Collectors.toMap(keyMapper, valueMapper) throws IllegalStateException on duplicate keys. Provide a merge function: toMap(k, v, (a, b) -> b) to keep the last. Java 10+ toUnmodifiableMap() returns an immutable Map."],
["Collectors.partitioningBy()?","Splits a stream into two groups (true/false) based on a Predicate: partitioningBy(n -> n % 2 == 0). Result is Map<Boolean, List<T>>. Equivalent to groupingBy with a boolean classifier but typed as Map<Boolean,…>."],
["How to get the top N elements from a stream?","stream.sorted(Comparator.reverseOrder()).limit(N).collect(toList()) — sorts all then takes top N (O(n log n)). For large streams, prefer a PriorityQueue-based approach (O(n log k)) which avoids full sort."],
],
scenarios:[
["Find the total salary of employees earning over 50k, by department.","employees.stream().filter(e -> e.getSalary() > 50000).collect(groupingBy(Employee::getDept, summingDouble(Employee::getSalary)))"],
["Given a list of sentences, find all unique words, sorted alphabetically.","sentences.stream().flatMap(s -> Arrays.stream(s.split(\"\\\\W+\"))).map(String::toLowerCase).filter(w -> !w.isBlank()).collect(Collectors.toCollection(TreeSet::new))"],
["You need to process a list of 10 million items. When would you use a parallel stream?","Only if the task is CPU-bound, each element's processing is independent and stateless, no shared mutable state exists, and the dataset is large enough to outweigh parallelisation overhead. Always benchmark with JMH first."],
],
coding:[
["Group employees by department and get the highest-paid in each.","groupingBy with Collectors.maxBy downstream.",`Map<String, Optional<Employee>> topPaid = employees.stream()
    .collect(Collectors.groupingBy(
        Employee::getDept,
        Collectors.maxBy(Comparator.comparingDouble(Employee::getSalary))));`],
["Flatten a list of lists into a single list of unique elements.","flatMap + distinct.",`List<T> unique = lists.stream()
    .flatMap(Collection::stream)
    .distinct()
    .collect(Collectors.toList());`],
["Compute running total (prefix sum) of an integer list.","IntStream with stateful approach using an AtomicInteger or reduce with collect.",`// Simple: convert index-by-index
int[] arr = list.stream().mapToInt(Integer::intValue).toArray();
for (int i = 1; i < arr.length; i++) arr[i] += arr[i-1];`],
]},
{id:"concurrency",phase:"core",title:"Multithreading & Concurrency",tag:"Advanced",level:"advanced",
summary:"Thread lifecycle, synchronisation, Java Memory Model, Executor framework, locks, atomic variables, and virtual threads.",
concepts:[
["Thread Lifecycle","NEW → RUNNABLE → BLOCKED/WAITING/TIMED_WAITING → TERMINATED."],
["synchronized","Acquires intrinsic lock on entry, releases on exit; ensures mutual exclusion and visibility."],
["volatile","Guarantees visibility of writes across threads; does NOT guarantee atomicity."],
["Java Memory Model","Defines happens-before rules ensuring predictable visibility of shared state."],
["Executor Framework","Thread pool abstraction; ExecutorService, ThreadPoolExecutor, Executors factory."],
["Future / CompletableFuture","Handle to an async result; CompletableFuture adds non-blocking composition."],
["ReentrantLock","Explicit lock with tryLock(), lockInterruptibly(), and Condition for await/signal."],
["AtomicInteger","Lock-free thread-safe integer using CAS (compare-and-swap) hardware primitives."],
["CountDownLatch","One-time countdown; threads call countDown(), others await(0)."],
["CyclicBarrier","Reusable barrier; all parties call await(), released together when all arrive."],
["Semaphore","Controls access via permits; acquire() blocks, release() returns a permit."],
["ThreadLocal","Per-thread variable; each thread gets its own copy."],
["Virtual Threads","Java 21 — JVM-managed lightweight threads; millions can coexist; blocking is cheap."],
],
questions:[
["Difference between process and thread?","Process: independent memory space, heavyweight, OS-managed. Thread: shares process memory, lightweight, concurrent within a process. Java threads map to OS platform threads (or virtual threads in Java 21). Context-switching between threads in the same process is cheaper than between processes."],
["How do you create a thread?","1) Extend Thread, override run(). 2) Implement Runnable, pass to new Thread(r).start(). 3) Implement Callable<V>, submit to ExecutorService for a Future<V>. Prefer option 3 — it decouples task logic from thread management and allows return values and checked exceptions."],
["start() vs run()?","start() creates a new OS thread and schedules run() on it — concurrent execution. Calling run() directly executes in the current thread — no new thread is created. Always call start() to achieve concurrency."],
["What is synchronized?","Keyword that acquires an intrinsic (monitor) lock on entry to a method or block and releases it on exit. Only one thread holds a given lock at a time — ensures mutual exclusion and establishes happens-before. Method-level locks on `this` (instance) or the Class (static methods)."],
["Synchronized method vs synchronized block?","Synchronized method locks the entire object for the method's duration. Synchronized block locks a specified object for a narrower scope. Prefer blocks for finer granularity — reduces contention and improves throughput."],
["What is a race condition?","A bug where the outcome depends on the relative timing of thread scheduling. Example: two threads read a counter, both increment locally, both write back — one increment is lost. Fix: synchronization, AtomicInteger, or immutable state."],
["What is a deadlock?","Two or more threads each holding a lock the other needs, waiting forever. Prevention strategies: always acquire locks in a consistent global order; use tryLock() with timeout; prefer higher-level abstractions (concurrent collections, CompletableFuture) over raw locks."],
["What is volatile?","Guarantees visibility: a volatile write is immediately visible to all threads (no CPU-cache staling). Does NOT provide atomicity — volatile++ is still a race condition. Suitable for simple boolean flags (volatile boolean running). Use AtomicInteger for compound operations."],
["What is the happens-before relationship?","A JMM guarantee that all actions performed by thread A before an event are visible to thread B after that event. Rules: within a thread (sequential); monitor unlock happens-before subsequent lock on the same monitor; volatile write happens-before subsequent read; thread.start() and thread.join() establish happens-before."],
["wait() vs sleep()?","wait(): releases the intrinsic lock and suspends the thread until notify/notifyAll — must be called inside a synchronized block; waking requires re-acquiring the lock. sleep(): pauses the thread for a fixed time without releasing any lock. Use wait/notify for inter-thread signalling."],
["Executor framework?","Abstraction over thread management. Executors factory: newFixedThreadPool(n), newCachedThreadPool, newSingleThreadExecutor. Submit Runnable (no result) or Callable<V> (returns Future<V>). ThreadPoolExecutor is the full-featured implementation with corePoolSize, maxPoolSize, workQueue, and rejection handler."],
["Future vs CompletableFuture?","Future: basic — get() blocks until done, no composition, no callbacks, no exception transformation. CompletableFuture: non-blocking composition via thenApply, thenCompose, thenCombine, whenComplete, exceptionally; supports functional async pipelines; can be manually completed."],
["ReentrantLock vs synchronized?","ReentrantLock offers: tryLock() (non-blocking), lockInterruptibly(), Condition for per-lock await/signal (finer than wait/notify), fairness option. Must release in finally block. Use synchronized for simple cases; ReentrantLock when you need tryLock, interruptible locking, or multiple conditions."],
["CountDownLatch vs CyclicBarrier?","CountDownLatch: one-time latch — threads call countDown(); waiting threads call await(). CyclicBarrier: reusable — all parties call await() and are released together when the count reaches zero; resets for the next round. Use CyclicBarrier for iterative parallel phases."],
["What is ThreadLocal?","Provides a per-thread copy of a variable — each thread gets its own instance via ThreadLocal.withInitial(supplier). Used for thread-unsafe objects (SimpleDateFormat, SimpleDatabaseConnection) or request context (authenticated user). Critical: in thread pools, call remove() when done to avoid memory leaks and stale state."],
["What is false sharing?","Two unrelated variables happen to reside on the same CPU cache line. When one thread modifies its variable, the entire cache line is invalidated for all cores, causing heavy cache-coherence traffic even though the variables are logically independent. Fix: use @Contended (JDK internal) or manually pad fields to separate cache lines."],
["What are virtual threads (Java 21)?","JVM-managed lightweight threads — millions can exist simultaneously with low memory overhead. When a virtual thread blocks (I/O, sleep), the JVM unmounts it from its carrier OS thread and parks it, freeing the OS thread for other work. Write plain blocking code; no reactive/async style needed. Create via Thread.ofVirtual().start(task) or Executors.newVirtualThreadPerTaskExecutor()."],
["What is a Semaphore?","Controls concurrent access to a resource pool via a permit count. acquire() blocks until a permit is available; release() returns one. Use to cap concurrency: e.g., max 10 simultaneous DB connections, rate-limiting API calls. tryAcquire(timeout) is non-blocking."],
["What is livelock and starvation?","Livelock: threads keep responding to each other's state without making progress (like two people stepping aside in the same direction). Starvation: a thread never gets CPU time because others are always preferred (e.g., unfair locks). Both are concurrency issues that do not involve blocking like deadlock."],
["What is ConcurrentHashMap vs Collections.synchronizedMap()?","synchronizedMap: wraps a HashMap, every method is synchronised on the map object — single lock, poor throughput. ConcurrentHashMap: uses per-bucket locking (CAS + fine-grained sync) — reads never block, writes lock only the affected bucket. Far better throughput under concurrent access."],
],
scenarios:[
["Your web service has a shared counter for active requests that updates on every request. How do you make it thread-safe without locks?","Use AtomicInteger or AtomicLong. CAS-based hardware primitives make increment/decrement lock-free and very fast. For example: AtomicInteger active = new AtomicInteger(); active.incrementAndGet() on start, decrementAndGet() on end."],
["N tasks can run in parallel, but only k at a time should access a shared resource.","Use a Semaphore(k). Each task acquires a permit before accessing the resource and releases it afterwards. This caps concurrent access at k without requiring callers to know about each other."],
["You need 5 background tasks to finish before proceeding. How?","Use CountDownLatch(5). Each task calls latch.countDown() when done; the main thread calls latch.await(). Alternatively, submit tasks to an ExecutorService and call invokeAll() which blocks until all Callables complete."],
["A thread pool processes HTTP requests. After processing, ThreadLocal user context leaks into the next request. How do you fix?","In a finally block (or as a Servlet filter's post-processing step) call userContext.remove() to clear the ThreadLocal. Consider wrapping the Runnable/Callable submitted to the pool in a decorator that clears ThreadLocal after execution."],
["You are designing a service that makes thousands of blocking I/O calls per second. Would you use platform threads or virtual threads?","Virtual threads (Java 21). Platform threads are expensive (~1MB stack, OS scheduling); you can't create thousands per second. Virtual threads are cheap and block cheaply — the JVM unmounts them from the carrier OS thread when blocked. Write plain blocking code; the JVM handles the scheduling."],
],
coding:[
["Producer-consumer using ArrayBlockingQueue.","Blocking queue coordinates producer and consumer threads.",`BlockingQueue<String> queue = new ArrayBlockingQueue<>(100);

// Producer
Thread producer = Thread.ofPlatform().start(() -> {
    try {
        while (true) { queue.put(produce()); }
    } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
});

// Consumer
Thread consumer = Thread.ofPlatform().start(() -> {
    try {
        while (true) { consume(queue.take()); }
    } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
});`],
["Use CompletableFuture to fetch user and their orders in parallel, then combine.","thenCombine runs two independent futures concurrently.",`CompletableFuture<UserProfile> userFuture   = fetchUser(id);
CompletableFuture<List<Order>> ordersFuture = fetchOrders(id);

CompletableFuture<UserDashboard> dashboard =
    userFuture.thenCombine(ordersFuture,
        (user, orders) -> new UserDashboard(user, orders));`],
["Thread-safe singleton with double-checked locking.","volatile + synchronised ensures correctness without full locking overhead.",`public class LegacySingleton {
    private static volatile LegacySingleton instance;

    private LegacySingleton() {}

    public static LegacySingleton getInstance() {
        if (instance == null) {
            synchronized (LegacySingleton.class) {
                if (instance == null) instance = new LegacySingleton();
            }
        }
        return instance;
    }
}`],
]});
